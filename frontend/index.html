<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halter Inteligente — Plataforma</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --fundo:#f6f6f4; --cartao:#ffffff; --borda:#e8e7e3; --grade:#efeeea; --suave:#f3f3f0;
    --txt:#111110; --txt2:#55544f; --mudo:#86857f; --acento:#2a78d6; --acento-suave:#2a78d61a; --erro:#c62f2f;
    /* paleta categórica (ordem fixa): saudável = s1 (azul), afetado = s2 (laranja) */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --neutro:#9a9993;
    --faixa-boa:#0ca30c1c; --sombra:0 1px 2px #0000000a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fundo:#111110; --cartao:#1a1a19; --borda:#2a2a28; --grade:#262624; --suave:#222220;
      --txt:#f0efec; --txt2:#c3c2b7; --mudo:#8f8e86; --acento:#3987e5; --acento-suave:#3987e526; --erro:#e66767;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --neutro:#77766f;
      --faixa-boa:#0ca30c1f; --sombra:none;
    }
  }
  /* status: cores fixas, sempre com ícone + rótulo */
  :root { --bom:#0ca30c; --atencao:#fab219; --alerta:#d03b3b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--txt); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }

  /* Cabeçalho fixo com a trilha de navegação */
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; height:56px; padding:0 24px;
           background:color-mix(in srgb, var(--cartao) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--borda); }
  .marca { display:flex; align-items:center; gap:8px; font-weight:700; color:var(--txt); white-space:nowrap; }
  .marca:hover { text-decoration:none; }
  .marca i { width:24px; height:24px; border-radius:7px; background:var(--acento); color:#fff; display:grid; place-items:center; font-style:normal; font-size:13px; }
  .trilha { display:flex; align-items:center; gap:6px; min-width:0; font-size:14px; color:var(--mudo); }
  .trilha a { color:var(--txt2); white-space:nowrap; }
  .trilha b { font-weight:600; color:var(--txt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trilha .sep { opacity:.5; }
  #sair { margin-left:auto; }

  main { max-width:1120px; margin:0 auto; padding:28px 24px 80px; }
  h1 { margin:0; font-size:24px; font-weight:700; letter-spacing:-.01em; }
  h2 { margin:0 0 14px; font-size:15px; font-weight:650; color:var(--txt); }
  h3 { margin:0 0 4px; font-size:14px; font-weight:600; color:var(--txt); }
  a { color:var(--acento); text-decoration:none; } a:hover { text-decoration:underline; }
  .mudo { color:var(--mudo); } .pequeno { font-size:13px; } .erro { color:var(--erro); }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:var(--sombra); }
  .cartao.sem-pad { padding:8px; }
  .topo-pagina { display:flex; align-items:flex-end; justify-content:space-between; gap:12px 16px; flex-wrap:wrap; margin-bottom:22px; }
  .topo-pagina p { margin:4px 0 0; }
  .acoes { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .vazio { text-align:center; padding:48px 16px; color:var(--mudo); }

  /* Formulários e botões */
  label { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--txt2); margin-bottom:14px; }
  input, select, textarea { width:100%; min-width:0; font:inherit; color:var(--txt); background:var(--cartao); border:1px solid var(--borda); border-radius:8px; padding:8px 10px; }
  input:focus, select:focus, textarea:focus { outline:3px solid var(--acento-suave); border-color:var(--acento); }
  button { font:inherit; font-weight:500; padding:8px 14px; border-radius:8px; border:1px solid var(--borda); background:var(--cartao); color:var(--txt); cursor:pointer; white-space:nowrap; }
  button:hover { background:var(--suave); }
  button.pri { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  button.pri:hover { filter:brightness(1.08); }
  button.fantasma { border-color:transparent; background:transparent; color:var(--txt2); }
  button.fantasma:hover { background:var(--suave); color:var(--txt); }
  button.perigo { color:var(--erro); }
  button.ocupado { opacity:.6; pointer-events:none; }
  .botoes { display:flex; gap:8px; flex-wrap:wrap; }
  .grade-form { display:grid; grid-template-columns:repeat(6, 1fr); gap:0 12px; }
  .grade-form .l2 { grid-column:span 2; } .grade-form .l3 { grid-column:span 3; } .grade-form .l6 { grid-column:1 / -1; }
  .sub-cartao { background:var(--suave); border-radius:10px; padding:14px; margin:0 0 14px; }
  .rodape-form { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:4px; }
  .login { max-width:360px; margin:60px auto; }
  .login button { width:100%; }

  /* Menu "⋯" */
  details.menu { position:relative; }
  details.menu > summary { list-style:none; cursor:pointer; padding:8px 12px; border-radius:8px; border:1px solid var(--borda); background:var(--cartao); line-height:1.5; font-weight:700; }
  details.menu > summary::-webkit-details-marker { display:none; }
  details.menu > summary:hover { background:var(--suave); }
  .menu-itens { position:absolute; right:0; top:calc(100% + 6px); z-index:15; min-width:190px; display:flex; flex-direction:column; padding:6px;
                background:var(--cartao); border:1px solid var(--borda); border-radius:10px; box-shadow:0 10px 30px #0000001f; }
  .menu-itens button { border:0; background:none; text-align:left; }
  .menu-itens button:hover { background:var(--suave); }

  /* Abas */
  .barra { display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; border-bottom:1px solid var(--borda); margin-bottom:20px; }
  .abas { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
  .abas button { border:0; border-radius:0; background:none; padding:10px 12px; margin-bottom:-1px; color:var(--mudo); font-weight:550; border-bottom:2px solid transparent; }
  .abas button:hover { background:none; color:var(--txt); }
  .abas button[aria-selected="true"] { color:var(--txt); border-bottom-color:var(--acento); }
  .barra select { width:auto; margin:6px 0; padding:6px 10px; font-size:14px; }
  .barra .rotulo-ex { font-size:14px; color:var(--txt2); padding:6px 0; }

  /* Lista de pacientes */
  .busca { margin:4px 4px 6px; width:calc(100% - 8px); }
  .lista { list-style:none; margin:0; padding:0; }
  .lista li a { display:flex; align-items:center; gap:12px; padding:12px; border-radius:10px; color:var(--txt); }
  .lista li a:hover { background:var(--suave); text-decoration:none; }
  .avatar { flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--acento-suave); color:var(--acento); font-weight:700; font-size:13px; }
  .lista .info { flex:1; min-width:0; display:flex; flex-direction:column; }
  .lista .info small { color:var(--mudo); font-size:13px; }
  .lista .chev { color:var(--mudo); font-size:20px; }

  /* Tabelas */
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-weight:500; color:var(--mudo); font-size:13px; }
  th, td { padding:10px 8px; border-bottom:1px solid var(--borda); vertical-align:middle; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; }
  .tabela-rolavel { overflow-x:auto; }
  tr.clicavel { cursor:pointer; } tr.clicavel:hover td { background:var(--suave); }
  .bolinha { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .filtros { display:flex; gap:10px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--txt2); flex-wrap:wrap; }
  .filtros select { width:auto; padding:5px 8px; }

  /* Status (semáforo) */
  .status { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--txt);
            padding:2px 9px 2px 3px; border-radius:999px; background:var(--cartao); border:1px solid var(--borda); white-space:nowrap; }
  .status i { font-style:normal; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11px; }
  .status.bom i { background:var(--bom); } .status.atencao i { background:var(--atencao); color:#0b0b0b; } .status.alerta i { background:var(--alerta); }
  .status.sem { color:var(--mudo); padding-left:9px; }

  /* Destaque do score (situação atual e sessão) */
  .destaque { display:flex; align-items:center; gap:16px 32px; flex-wrap:wrap; }
  .destaque .numero { font-size:44px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .destaque .numero small { font-size:16px; font-weight:500; color:var(--mudo); letter-spacing:0; }
  .destaque .extra { display:flex; flex-direction:column; align-items:flex-start; gap:4px; font-size:14px; color:var(--txt2); }
  .destaque .link { margin-left:auto; font-weight:600; }

  /* Resumo da sessão */
  .resumo { display:grid; grid-template-columns:240px 1fr; gap:28px; }
  .score .valor { font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; margin:8px 0; letter-spacing:-.02em; }
  .score .valor small { font-size:18px; font-weight:500; color:var(--mudo); }
  .medidor { height:6px; border-radius:3px; background:var(--grade); margin-top:10px; overflow:hidden; }
  .medidor i { display:block; height:100%; border-radius:3px; }
  .notas-texto { list-style:none; margin:0; padding:0; }
  .notas-texto li { display:flex; gap:10px; padding:8px 0; }
  .notas-texto .icone { flex:0 0 20px; height:20px; margin-top:1px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11px; font-weight:700; }
  .icone.alerta { background:var(--alerta); } .icone.atencao { background:var(--atencao); color:#0b0b0b; } .icone.bom { background:var(--bom); }

  /* Indicadores */
  .indicadores { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .ind { background:var(--cartao); border:1px solid var(--borda); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:3px; box-shadow:var(--sombra); }
  .ind .topo { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ind .nome { font-weight:600; font-size:14px; color:var(--txt2); display:flex; align-items:center; gap:6px; }
  .ind .valor { font-size:19px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; line-height:1.3; }
  .ind .detalhe { font-size:13px; color:var(--mudo); }
  .ind .tendencia { font-size:13px; color:var(--txt2); margin-top:6px; }
  .seta { font-weight:800; } .seta.melhorou { color:var(--bom); } .seta.piorou { color:var(--alerta); } .seta.igual { color:var(--mudo); }
  .ajuda { display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%; border:1px solid var(--borda);
           font-size:10px; font-weight:600; color:var(--mudo); cursor:help; flex:0 0 16px; }

  /* Gráficos */
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:28px; }
  .multiplos { display:grid; grid-template-columns:repeat(3,1fr); gap:28px 24px; }
  .caixa-grafico { position:relative; height:210px; margin-top:10px; } .caixa-grafico.alto { height:280px; }
  .grafico-cartao h3 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grafico-cartao .melhor { font-size:11px; font-weight:500; color:var(--mudo); background:var(--suave); border-radius:6px; padding:1px 6px; }
  details.como-ler { margin-top:6px; font-size:13px; color:var(--txt2); }
  details.como-ler > summary { cursor:pointer; color:var(--mudo); font-size:12px; list-style:none; width:max-content; }
  details.como-ler > summary::-webkit-details-marker { display:none; }
  details.como-ler > summary::before { content:'ⓘ '; }
  details.como-ler[open] > summary { margin-bottom:4px; }
  .serie-fadiga { display:grid; grid-template-columns:1.6fr 1fr; gap:28px; align-items:start; }
  .serie-fadiga td, .serie-fadiga th { white-space:nowrap; padding:9px 6px; }
  .titulo-secao { margin:30px 0 14px; font-size:15px; font-weight:650; }
  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile { background:var(--suave); border-radius:10px; padding:10px 12px; }
  .tile .rotulo { font-size:12px; color:var(--mudo); } .tile .valor { font-size:18px; font-weight:700; } .tile .metodo { font-size:11px; color:var(--mudo); }

  /* Glossário (rodapé) */
  details.expansivel { margin-top:28px; }
  details.expansivel > summary { cursor:pointer; color:var(--mudo); font-size:14px; width:max-content; }
  details.expansivel[open] > summary { margin-bottom:12px; color:var(--txt); }
  .glossario dt { font-weight:600; margin-top:12px; }
  .glossario dd { margin:2px 0 0; color:var(--txt2); font-size:14px; }
  .glossario .faixas { font-size:13px; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }

  @media (max-width:900px) {
    .graficos, .resumo, .serie-fadiga { grid-template-columns:1fr; }
    .indicadores, .multiplos { grid-template-columns:1fr 1fr; }
    .grade-form { grid-template-columns:repeat(3, 1fr); } .grade-form .l2, .grade-form .l3 { grid-column:1 / -1; }
    .tiles { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:560px) {
    header { padding:0 16px; gap:10px; } .marca span { display:none; }
    main { padding:20px 16px 60px; }
    .indicadores, .multiplos { grid-template-columns:1fr; }
    .grade-form { grid-template-columns:1fr 1fr; }
    .destaque .link { margin-left:0; }
  }
</style>
</head>
<body>
<header>
  <a class="marca" href="#/"><i>H</i><span>Halter Inteligente</span></a>
  <nav class="trilha" id="trilha" aria-label="Navegação"></nav>
  <button id="sair" class="fantasma" hidden>Sair</button>
</header>
<main id="app"></main>

<script>
// ===================== UTILIDADES =====================
const $ = s => document.querySelector(s);
const app = $('#app');
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, casas = 1, un = '') => v == null || !isFinite(v) ? '—'
  : (+v).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + un;
const dataHora = iso => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const dataCurta = iso => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const nomeBraco = b => b === 'saudavel' ? 'Saudável' : 'Afetado';
const pct = v => v == null ? null : v * 100;

async function api(url, opcoes = {}) {
  const r = await fetch(url, { method: opcoes.method || 'GET', headers: { 'Content-Type': 'application/json' },
                               body: opcoes.body && JSON.stringify(opcoes.body) });
  if (r.status === 401) { location.hash = '#/login'; throw new Error('faça login novamente'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || `erro ${r.status}`);
  return r.json();
}
// Trilha de navegação no cabeçalho: [[texto, link], …, [texto atual]]
function trilha(itens = []) {
  $('#trilha').innerHTML = itens.map(([texto, href], i) => (i ? '<span class="sep">›</span>' : '') +
    (href ? `<a href="${href}">${esc(texto)}</a>` : `<b>${esc(texto)}</b>`)).join('');
}
// Abas: botões [data-aba] mostram o painel [data-painel] correspondente; a última aba aberta é lembrada
const abaLembrada = {};
function abas(chave, aoMostrar = {}) {
  const botoes = [...document.querySelectorAll('.abas [data-aba]')];
  if (!botoes.length) return;
  const mostrar = nome => {
    abaLembrada[chave] = nome;
    botoes.forEach(b => b.setAttribute('aria-selected', b.dataset.aba === nome));
    document.querySelectorAll('[data-painel]').forEach(p => { p.hidden = p.dataset.painel !== nome; });
    [...graficos, ...graficosSinais].forEach(g => g.resize());
    aoMostrar[nome]?.();
  };
  botoes.forEach(b => { b.setAttribute('role', 'tab'); b.onclick = () => mostrar(b.dataset.aba); });
  mostrar(botoes.some(b => b.dataset.aba === abaLembrada[chave]) ? abaLembrada[chave] : botoes[0].dataset.aba);
}
// Fecha menus "⋯" ao clicar fora
document.addEventListener('click', e => document.querySelectorAll('details.menu[open]').forEach(m => { if (!m.contains(e.target)) m.open = false; }));
const iniciais = nome => String(nome).trim().split(/\s+/).filter(Boolean).map(p => p[0]).filter((_, i, a) => i === 0 || i === a.length - 1).join('').toUpperCase();
const idade = nasc => { if (!nasc) return null; const d = new Date(nasc + 'T00:00'), h = new Date();
  return h.getFullYear() - d.getFullYear() - (h < new Date(h.getFullYear(), d.getMonth(), d.getDate()) ? 1 : 0); };

// Envia um formulário tratando erros
const aoEnviar = (form, acao) => form.onsubmit = async e => {
  e.preventDefault();
  try { await acao(Object.fromEntries(new FormData(form))); } catch (erro) { alert(erro.message); }
};

// ===================== GRÁFICOS =====================
let graficos = [];
function grafico(id, config, lista = graficos) {
  const el = document.getElementById(id);
  if (el && window.Chart) lista.push(new Chart(el, config));   // sem internet para o CDN: só os gráficos somem
}
// opcoes({ ref: { faixas: [{de, ate, texto}], linhas: [{y, texto}] } }) desenha faixas e linhas de referência
function opcoes({ x = '', y = '', xTipo = 'linear', legenda = true, yMin, yMax, un = '', ref, horizontal = false, rotulos = false, titulos } = {}) {
  const txt2 = cor('--txt2'), grade = cor('--grade');
  const eixoValor = { min: yMin, max: yMax, title: { display: !!y, text: y, color: txt2 }, ticks: { color: txt2, maxTicksLimit: 6 },
                      grid: { color: grade }, border: { display: false } };
  const eixoCategoria = { type: xTipo, title: { display: !!x, text: x, color: txt2 }, ticks: { color: txt2, maxTicksLimit: 10, autoSkip: true },
                          grid: { display: false }, border: { color: grade } };
  return {
    responsive: true, maintainAspectRatio: false, animation: false, indexAxis: horizontal ? 'y' : 'x',
    interaction: { mode: horizontal ? 'nearest' : 'index', intersect: horizontal },
    plugins: {
      legend: { display: legenda, align: 'start', labels: { color: txt2, boxWidth: 14, boxHeight: 3 } },
      tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${num(horizontal ? c.parsed.x : c.parsed.y, 1, un)}`,
                              ...(titulos ? { title: itens => titulos[itens[0].dataIndex] } : {}) } },
      referencias: ref || {}, rotulos: { ativo: rotulos },
    },
    scales: horizontal ? { x: eixoValor, y: { ...eixoCategoria, type: 'category' } } : { x: eixoCategoria, y: eixoValor },
    elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0 } },
  };
}
const serie = (label, data, varCor, extra = {}) => ({ label, data, borderColor: cor(varCor), backgroundColor: cor(varCor), ...extra });
const pontosXY = (xs, ys, escala = 1) => xs.map((x, i) => ({ x, y: ys[i] == null ? null : ys[i] * escala }));
const comPontos = () => ({ pointRadius: 4, pointHoverRadius: 6, spanGaps: true, pointBorderColor: cor('--cartao'), pointBorderWidth: 2 });

if (window.Chart) {
  Chart.register({                       // faixas (ex.: "faixa do ritmo") e linhas de referência (ex.: "meta")
    id: 'referencias',
    beforeDatasetsDraw(chart, _, o) {
      const { ctx, chartArea: { left, right, top, bottom }, scales: { y } } = chart;
      if (!y || y.type === 'category') return;
      ctx.save(); ctx.font = '11px system-ui';
      for (const f of o.faixas || []) {
        const y1 = Math.max(top, y.getPixelForValue(f.ate)), y2 = Math.min(bottom, y.getPixelForValue(f.de));
        ctx.fillStyle = cor('--faixa-boa'); ctx.fillRect(left, y1, right - left, y2 - y1);
        if (f.texto) { ctx.fillStyle = cor('--txt2'); ctx.fillText(f.texto, left + 6, y2 - 5); }   // rótulo no canto inferior da faixa
      }
      for (const l of o.linhas || []) {
        const yy = y.getPixelForValue(l.y);
        if (yy < top || yy > bottom) continue;
        ctx.strokeStyle = cor('--neutro'); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(left, yy); ctx.lineTo(right, yy); ctx.stroke();
        if (l.texto) { ctx.fillStyle = cor('--txt2'); ctx.textAlign = 'right'; ctx.fillText(l.texto, right - 4, yy - 5); ctx.textAlign = 'left'; }
      }
      ctx.restore();
    },
  });
  Chart.register({                       // valor escrito na ponta de cada barra horizontal
    id: 'rotulos',
    afterDatasetsDraw(chart, _, o) {
      if (!o.ativo) return;
      const { ctx } = chart;
      ctx.save(); ctx.font = '600 12px system-ui'; ctx.fillStyle = cor('--txt'); ctx.textBaseline = 'middle';
      chart.data.datasets.forEach((ds, i) => chart.getDatasetMeta(i).data.forEach((barra, j) => {
        if (ds.data[j] != null) ctx.fillText(Math.round(ds.data[j]), barra.x + 6, barra.y);
      }));
      ctx.restore();
    },
  });
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
}
// Cartão de gráfico: pergunta clínica como título, "melhor se ↑/↓" e instrução de leitura
const cartaoGrafico = (id, titulo, comoLer, { alto = false, melhor = '' } = {}) => `
  <div class="grafico-cartao"><h3>${titulo}${melhor ? `<span class="melhor">${melhor === 'maior' ? '↑ maior é melhor' : '↓ menor é melhor'}</span>` : ''}</h3>
  <div class="caixa-grafico ${alto ? 'alto' : ''}"><canvas id="${id}"></canvas></div>
  <details class="como-ler"><summary>Como ler</summary>${comoLer}</details></div>`;

// ===================== INTERPRETAÇÃO CLÍNICA =====================
// Faixas iniciais de interpretação (Bom / Atenção / Alerta). Devem ser revisadas com a equipe clínica.
const FAIXAS = {
  score:     { bom: 70, atencao: 40, maior: true },     // score geral, 0–100
  amplitude: { bom: 90, atencao: 70, maior: true },     // amplitude do afetado em % do saudável
  ritmo:     { bom: 80, atencao: 50, maior: true },     // % das repetições no ritmo
  controle:  { bom: 70, atencao: 40, maior: true },     // nota de trajetória, 0–100
  razao:     { bom: 1.3, atencao: 2.0, maior: false },  // afetado ÷ saudável (fluidez, tremor)
};
const nivel = (v, f) => v == null || !isFinite(v) ? null
  : f.maior ? (v >= f.bom ? 'bom' : v >= f.atencao ? 'atencao' : 'alerta')
            : (v <= f.bom ? 'bom' : v <= f.atencao ? 'atencao' : 'alerta');
const STATUS = { bom: ['✓', 'Bom'], atencao: ['!', 'Atenção'], alerta: ['✕', 'Alerta'] };
const chip = n => n ? `<span class="status ${n}"><i>${STATUS[n][0]}</i>${STATUS[n][1]}</span>` : '<span class="status sem">sem dados</span>';
const razao = (a, b) => a == null || !b ? null : a / b;
const vezes = (r, adjetivo) => r == null ? '—' : r < 1.15 ? 'semelhante ao saudável' : `${num(r, 1)}× ${adjetivo} que o saudável`;
const faixaTexto = f => f.maior
  ? `${chip('bom')} ≥ ${num(f.bom, f.bom < 10 ? 1 : 0)} ${chip('atencao')} ${num(f.atencao, 0)} a ${num(f.bom, 0)} ${chip('alerta')} < ${num(f.atencao, 0)}`
  : `${chip('bom')} até ${num(f.bom, 1)}× ${chip('atencao')} ${num(f.bom, 1)}× a ${num(f.atencao, 1)}× ${chip('alerta')} acima de ${num(f.atencao, 1)}×`;

// Indicadores do braço afetado, em linguagem clínica, a partir do resumo da sessão
function indicadores(an) {
  const af = an?.bracos?.afetado || {}, sa = an?.bracos?.saudavel || {}, ma = af.metricas || {}, ms = sa.metricas || {};
  const amp = an?.simetria?.excursao_pct ?? null;
  const ritmo = pct(af.jogo?.aderencia_cadencia), tempo = af.jogo?.tempo_relativo;
  const rFlu = razao(ma.jerk_medio, ms.jerk_medio), rTre = razao(ma.rms_tremor, ms.rms_tremor);
  return [
    { id: 'amplitude', nome: 'Amplitude de movimento', pergunta: 'Até onde o braço afetado consegue ir?', numero: amp, faixa: FAIXAS.amplitude,
      valor: amp == null ? '—' : `${num(amp, 0)} % do saudável`,
      detalhe: ma.excursao == null ? '' : `${num(ma.excursao, 0)}° no afetado · ${num(ms.excursao, 0)}° no saudável`,
      explica: 'Ângulo que o haltere percorre em cada repetição, comparado ao braço saudável na mesma sessão.' },
    { id: 'ritmo', nome: 'Ritmo', pergunta: 'Acompanha a cadência pedida?', numero: ritmo, faixa: FAIXAS.ritmo,
      valor: ritmo == null ? '—' : `${num(ritmo, 0)} % das repetições no ritmo`,
      detalhe: tempo == null ? '' : tempo > 1.1 ? `em média ${num((tempo - 1) * 100, 0)} % mais lento que o pedido`
        : tempo < 0.9 ? `em média ${num((1 - tempo) * 100, 0)} % mais rápido que o pedido` : 'tempo médio dentro do pedido',
      explica: 'Uma repetição está no ritmo quando dura até 20 % a mais ou a menos que o tempo pedido (60 ÷ cadência).' },
    { id: 'controle', nome: 'Controle do movimento', pergunta: 'Segue a trajetória esperada?', numero: af.notas?.trajetoria, faixa: FAIXAS.controle,
      valor: af.notas?.trajetoria == null ? '—' : `${num(af.notas.trajetoria, 0)} de 100`,
      detalhe: ma.rmse_trajetoria == null ? '' : `desvio médio de ${num(ma.rmse_trajetoria, 0)}° do movimento ideal`,
      explica: 'Compara a forma de cada repetição com um movimento ideal suave, no ritmo pedido e na amplitude que a própria repetição alcançou (a amplitude é avaliada no indicador ao lado).' },
    { id: 'fluidez', nome: 'Fluidez', pergunta: 'O movimento é contínuo ou "travado"?', numero: rFlu, faixa: FAIXAS.razao,
      valor: vezes(rFlu, 'mais irregular'), detalhe: 'trancos e mudanças bruscas de velocidade (jerk)',
      explica: 'Mede trancos e mudanças bruscas de velocidade. Movimentos em "degraus" ou com paradas aumentam o valor.' },
    { id: 'tremor', nome: 'Tremor', pergunta: 'Há oscilações involuntárias?', numero: rTre, faixa: FAIXAS.razao,
      valor: vezes(rTre, 'maior'), detalhe: ma.rms_tremor == null ? '' : `intensidade de ${num(ma.rms_tremor, 2)} m/s²`,
      explica: 'Oscilações rápidas separadas do movimento voluntário, comparadas às do braço saudável.' },
  ].map(i => ({ ...i, nivel: nivel(i.numero, i.faixa) }));
}

// Seta de tendência em relação a outra sessão (verde = melhorou, vermelho = piorou)
function tendencia(atual, antes, faixa, texto) {
  if (atual == null || antes == null) return '';
  const d = atual - antes, limiar = faixa.maior === false ? 0.1 : 2;
  if (Math.abs(d) < limiar) return `<span class="seta igual">=</span> estável ${texto}`;
  const melhorou = faixa.maior === false ? d < 0 : d > 0;
  const valor = faixa.maior === false ? `${d > 0 ? '+' : '−'}${num(Math.abs(d), 1)}×` : `${d > 0 ? '+' : '−'}${num(Math.abs(d), 0)}`;
  return `<span class="seta ${melhorou ? 'melhorou' : 'piorou'}">${d > 0 ? '↑' : '↓'} ${valor}</span> ${texto}`;
}

const cartaoIndicador = (i, antes, textoTendencia) => `
  <div class="ind">
    <div class="topo"><div class="nome">${i.nome}<span class="ajuda" title="${esc(i.pergunta + ' ' + i.explica)}">?</span></div>${chip(i.nivel)}</div>
    <div class="valor">${i.valor}</div>
    ${i.detalhe ? `<div class="detalhe">${i.detalhe}</div>` : ''}
    ${antes ? `<div class="tendencia">${tendencia(i.numero, antes.numero, i.faixa, textoTendencia)}</div>` : ''}
  </div>`;

// Frases automáticas: cada comentário é montado a partir das métricas extraídas do sinal do haltere
// (amplitude, tempo das repetições, RMSE da trajetória, jerk, tremor), sempre com o valor medido,
// a referência (braço saudável ou meta configurada) e, quando cabe, uma sugestão ligada a esse valor.
function interpretar(an, series, anterior) {
  const atencao = [], destaques = [];
  const af = an?.bracos?.afetado, sa = an?.bracos?.saudavel || {};
  if (!af?.metricas) return { atencao, destaques };
  const ma = af.metricas, ms = sa.metricas || {}, jg = af.jogo || {};
  const ind = Object.fromEntries(indicadores(an).map(i => [i.id, i]));
  const registrar = (n, texto) => { if (n === 'bom') destaques.push(texto); else if (n) atencao.push([n, texto]); };
  const comSaudavel = (v, casas, un) => v == null ? '' : ` (saudável: ${num(v, casas, un)})`;

  // Amplitude: excursão angular média (°), em % do saudável e em % da meta configurada
  {
    const i = ind.amplitude, alvo = jg.amplitude_alvo, pMeta = ma.amplitude_pct;
    const n = i.nivel ?? nivel(pMeta, FAIXAS.amplitude);
    if (n) {
      let t = `Amplitude: o braço afetado percorreu em média ${num(ma.excursao, 0, '°')} por repetição`;
      if (i.numero != null) t += `, ${num(i.numero, 0)} % dos ${num(ms.excursao, 0, '°')} do saudável`;
      if (pMeta != null && alvo) t += `${i.numero != null ? ' e' : ','} ${num(pMeta, 0)} % da meta de ${num(alvo, 0, '°')}`;
      t += '.';
      if (n !== 'bom' && pMeta != null && pMeta < 80)
        t += ` A meta configurada está acima do que o braço alcança hoje: considere aproximar a posição alta de ${num(ma.excursao, 0, '°')} de amplitude e progredir aos poucos.`;
      registrar(n, t);
    }
  }

  // Ritmo: % de repetições no ritmo e duração média da repetição em relação ao tempo pedido
  {
    const i = ind.ritmo, tempo = jg.tempo_relativo;
    if (i.nivel) {
      let t = `Ritmo: ${num(i.numero, 0)} % das ${jg.total_reps ?? '—'} repetições do braço afetado ficaram no ritmo`;
      if (tempo != null) t += tempo > 1.1 ? `; em média, cada repetição durou ${num((tempo - 1) * 100, 0)} % a mais que o pedido`
        : tempo < 0.9 ? `; em média, cada repetição durou ${num((1 - tempo) * 100, 0)} % a menos que o pedido` : '; a duração média ficou dentro do tempo pedido';
      t += '.';
      if (i.nivel !== 'bom' && tempo > 1.2) t += ' Considere reduzir a cadência.';
      else if (i.nivel !== 'bom' && tempo < 0.8) t += ' Reforce o controle, principalmente na descida.';
      else if (i.nivel !== 'bom') t += ' A duração média está próxima do pedido, mas varia muito entre as repetições: observe a regularidade.';
      registrar(i.nivel, t);
    }
  }

  // Controle: RMSE da curva média em relação ao movimento ideal (°) e nota de trajetória
  {
    const i = ind.controle;
    if (i.nivel) registrar(i.nivel, `Controle: a repetição média do braço afetado se desviou ${num(ma.rmse_trajetoria, 1, '°')} da trajetória ideal`
      + `${comSaudavel(ms.rmse_trajetoria, 1, '°')}, nota ${num(i.numero, 0)} de 100.`);
  }

  // Fluidez e tremor: razão afetado ÷ saudável das métricas de sinal
  const razaoTexto = r => r < 1.15 ? 'semelhante ao saudável' : `${num(r, 1)}× o do saudável`;
  if (ind.fluidez.nivel) registrar(ind.fluidez.nivel, `Fluidez: jerk médio de ${num(ma.jerk_medio, 1, ' m/s³')} no braço afetado`
    + `${comSaudavel(ms.jerk_medio, 1, ' m/s³')}, ${razaoTexto(ind.fluidez.numero)}.`
    + (ind.fluidez.nivel !== 'bom' ? ' O movimento tem mais trancos e paradas: priorize uma execução lenta e contínua.' : ''));
  if (ind.tremor.nivel) registrar(ind.tremor.nivel, `Tremor: oscilação de ${num(ma.rms_tremor, 2, ' m/s²')} (RMS) no braço afetado`
    + `${comSaudavel(ms.rms_tremor, 2, ' m/s²')}, ${razaoTexto(ind.tremor.numero)}.`);

  // Fadiga: amplitude média do braço afetado da 1ª para a última série
  const doAfetado = series.filter(s => s.braco === 'afetado' && s.amp_media != null).sort((a, b) => a.n - b.n);
  if (doAfetado.length >= 2 && doAfetado[0].amp_media) {
    const ini = doAfetado[0].amp_media, fim = doAfetado.at(-1).amp_media, queda = 100 * (1 - fim / ini);
    if (queda >= 10) atencao.push(['atencao', `Fadiga: a amplitude média do braço afetado caiu de ${num(ini, 0, '°')} na 1ª série para ${num(fim, 0, '°')} na última (−${num(queda, 0)} %). Considere mais descanso entre as séries ou menos repetições.`]);
    else if (queda <= -10) destaques.push(`A amplitude média do braço afetado subiu de ${num(ini, 0, '°')} na 1ª série para ${num(fim, 0, '°')} na última (+${num(-queda, 0)} %).`);
  }

  // Simetria temporal: atraso do ponto mais alto do afetado em relação ao saudável (% do ciclo)
  const atraso = an.simetria?.atraso_apice_pct;
  if (atraso >= 5) atencao.push(['atencao', `Simetria: o braço afetado chega ao ponto mais alto ${num(atraso, 0)} % do ciclo depois do saudável, ou seja, a subida é mais lenta.`]);

  // Comparação com a sessão anterior do mesmo exercício, indicador a indicador
  if (anterior?.analise) {
    const antes = Object.fromEntries(indicadores(anterior.analise).map(i => [i.id, i]));
    const dScore = an.score_geral != null && anterior.analise.score_geral != null ? an.score_geral - anterior.analise.score_geral : 0;
    if (dScore >= 5) destaques.push(`Score do braço afetado: de ${num(anterior.analise.score_geral, 0)} para ${num(an.score_geral, 0)} em relação à sessão anterior.`);
    if (dScore <= -5) atencao.push(['atencao', `Score do braço afetado: de ${num(anterior.analise.score_geral, 0)} para ${num(an.score_geral, 0)} em relação à sessão anterior.`]);
    const formato = { amplitude: v => `${num(v, 0)} %`, ritmo: v => `${num(v, 0)} %`, controle: v => `${num(v, 0)}/100` };
    for (const i of Object.values(ind)) {
      const v0 = antes[i.id]?.numero, v1 = i.numero;
      if (v0 == null || v1 == null) continue;
      const razao = i.faixa === FAIXAS.razao, d = v1 - v0;
      if (Math.abs(d) < (razao ? 0.3 : 10)) continue;              // só variações relevantes
      const f = formato[i.id] || (v => `${num(v, 1)}×`);
      const melhorou = razao ? d < 0 : d > 0;
      const t = `${i.nome}: ${f(v0)} → ${f(v1)} desde a sessão anterior.`;
      if (melhorou) destaques.unshift(t); else atencao.push(['atencao', t]);
    }
  }
  atencao.sort((a, b) => (a[0] === 'alerta' ? 0 : 1) - (b[0] === 'alerta' ? 0 : 1));
  return { atencao, destaques };
}

// Glossário: o que cada indicador mede e como é classificado
function glossario() {
  const ind = indicadores({});
  return `<details class="expansivel"><summary>ⓘ Entenda os indicadores e as cores</summary>
    <p class="pequeno mudo">As cores comparam o braço afetado com faixas de referência e, quando possível, com o próprio braço saudável do paciente na mesma sessão.
    As faixas são valores iniciais e podem ser ajustadas pela equipe clínica.</p>
    <dl class="glossario">

        <div class="faixas">${faixaTexto(FAIXAS.score)}</div></dd>
      ${ind.map(i => `<dt>${i.nome}</dt><dd>${i.explica}<div class="faixas">${faixaTexto(i.faixa)}</div></dd>`).join('')}
    </dl></details>`;
}

        <label>Séries<input name="series_alvo" type="number" min="1" max="10" required></label>

      </div>

        <p class="mudo pequeno" id="resumoPlano" style="margin:0"></p>
        <div class="botoes">${sessoes.length ? '<button type="button" class="fantasma" id="btCancelarSessao">Cancelar</button>' : ''}
          <button class="pri">Criar sessão e abrir o jogo</button></div>
      </div>
    </form>

    ${comSessoes.length ? `
    <div class="barra">
      <div class="abas"><button data-aba="situacao">Situação atual</button><button data-aba="evolucao">Evolução</button><button data-aba="historico">Histórico</button></div>
      ${comSessoes.length > 1
        ? `<select id="fExercicio" aria-label="Exercício">${comSessoes.map(e => `<option value="${e.id}" ${e.id === foco ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>`
        : `<span class="rotulo-ex">${esc(comSessoes[0].nome)}</span>`}
    </div>

    <section data-painel="situacao"><div id="situacao"></div></section>

    <section data-painel="evolucao" hidden>
      <p class="mudo pequeno" id="semEvolucao"></p>
      <div class="cartao"><div class="graficos">
        ${cartaoGrafico('gSim', 'O braço afetado está se aproximando do saudável?',
          'cada ponto é uma sessão. 100 % = o braço afetado alcança a mesma amplitude do saudável. A faixa verde é a região de simetria (90 % a 110 %).', { alto: true, melhor: 'maior' })}
        ${cartaoGrafico('gScore', 'Score geral de cada braço',
          'resume controle, simetria e fluidez (0 a 100). A distância entre as linhas mostra quanto o afetado ainda está atrás do saudável.', { alto: true, melhor: 'maior' })}
      </div></div>
      <div class="cartao"><div class="multiplos">
        ${cartaoGrafico('evAmp', 'Amplitude alcançada (°)', 'ângulo médio percorrido por repetição.', { melhor: 'maior' })}
        ${cartaoGrafico('evRitmo', 'Repetições no ritmo (%)', 'parte das repetições feitas no tempo pedido.', { melhor: 'maior' })}
        ${cartaoGrafico('evControle', 'Desvio do movimento ideal (°)', 'quanto a repetição média se afasta da trajetória ideal.', { melhor: 'menor' })}
        ${cartaoGrafico('evFluidez', 'Fluidez: afetado ÷ saudável', 'quantas vezes o movimento do afetado tem mais trancos. 1 = igual ao saudável.', { melhor: 'menor' })}
        ${cartaoGrafico('evTremor', 'Tremor: afetado ÷ saudável', 'quantas vezes o tremor do afetado é maior. 1 = igual ao saudável.', { melhor: 'menor' })}
      </div></div>
    </section>

    <section data-painel="historico" hidden><div class="cartao sem-pad tabela-rolavel" id="tabelaSessoes"></div></section>
    ${glossario()}`
    : sessoes.length ? '' : '<p class="vazio">Ainda não há sessões. Configure a primeira acima e abra o jogo.</p>'}`;

  // ---- Exportar: baixa o .zip só se o servidor respondeu com ele; senão mostra o erro ----
  $('#btExportar').onclick = async ev => {
    ev.preventDefault();
    const bt = $('#btExportar'), texto = bt.textContent;
    bt.classList.add('ocupado'); bt.textContent = 'Gerando arquivo…';
    try {
      const r = await fetch(`/api/patients/${id}/export`);
      if (r.status === 401) { location.hash = '#/login'; return; }
      if (r.status === 404) throw new Error('o servidor não reconheceu a exportação. Reinicie o backend (python backend/app.py) e tente de novo.');
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || `erro ${r.status} no servidor`);
      if (!(r.headers.get('Content-Type') || '').includes('zip')) throw new Error('o servidor não devolveu um arquivo .zip.');
      const nome = /filename="?([^";]+)"?/.exec(r.headers.get('Content-Disposition') || '')?.[1] || `halter_paciente_${id}.zip`;
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(await r.blob()), download: nome });
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000);
    } catch (erro) {
      alert('Não foi possível exportar: ' + erro.message);
    } finally {
      bt.classList.remove('ocupado'); bt.textContent = texto;
    }
  };

  // ---- Editar e excluir paciente ----
  const fecharMenu = () => document.querySelectorAll('details.menu').forEach(m => { m.open = false; });
  $('#btEditar').onclick = () => { fecharMenu(); $('#fSessao').hidden = true; $('#fEditar').hidden = false; $('#fEditar [name=nome]').focus(); };
  $('#btCancelarEdicao').onclick = () => { $('#fEditar').hidden = true; };
  aoEnviar($('#fEditar'), async dados => { await api(`/api/patients/${id}`, { method: 'PUT', body: dados }); rota(); });
  $('#btExcluir').onclick = async () => {
    fecharMenu();
    const aviso = `Excluir ${p.nome}${sessoes.length ? ` e as ${sessoes.length} sessões registradas (com todas as leituras do haltere)` : ''}?\n\nEsta ação não pode ser desfeita.`;
    if (!confirm(aviso)) return;
    try { await api(`/api/patients/${id}`, { method: 'DELETE' }); location.hash = '#/'; } catch (e) { alert(e.message); }
  };

  // ---- Formulário de nova sessão: categoria e valores da última sessão desse exercício ----
  const form = $('#fSessao'), sel = $('#selExercicio');
  $('#btNovaSessao').onclick = () => { $('#fEditar').hidden = true; form.hidden = false; form.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); sel.focus(); };
  if ($('#btCancelarSessao')) $('#btCancelarSessao').onclick = () => { form.hidden = true; };
  const resumirPlano = () => {
    const n = +form.series_alvo.value || 0, r = +form.reps_alvo.value;
    const [a, b] = form.ordem.value === 'afetado' ? ['afetado', 'saudável'] : ['saudável', 'afetado'];
    $('#resumoPlano').textContent = n ? `${n} ${n === 1 ? 'série' : 'séries'} × 2 braços = ${2 * n} etapas no jogo`
      + (r ? ` (${r} repetições cada, ${2 * n * r} no total)` : '') + `. Em cada série: braço ${a}, depois braço ${b}.` : '';
  };
  function preencher() {
    const e = exercicio(+sel.value), u = ultimaDe(+sel.value) || {};
    form.cadencia_alvo.value = u.cadencia_alvo || 12; form.reps_alvo.value = u.reps_alvo || 10;
    form.series_alvo.value = u.series_alvo || 3; form.ordem.value = u.ordem || 'saudavel';
    form.amp_min.value = u.amp_min ?? 0; form.amp_max.value = u.amp_max ?? 60; form.duracao_min.value = u.duracao_min || 2;
    $('#descExercicio').textContent = e?.descricao || '';
    resumirPlano();
  }
  form.oninput = resumirPlano;
  sel.onchange = preencher;
  aoEnviar(form, async dados => {
    const { jogo } = await api('/api/sessions', { method: 'POST', body: { ...dados, patient_id: id } });
    location.href = jogo;                          // abre o jogo já configurado
  });
  preencher();

  // ---- Situação, evolução e histórico: sempre de um exercício por vez ----
  function atualizar() {
    const eid = $('#fExercicio') ? +$('#fExercicio').value : comSessoes[0]?.id ?? null;
    const doExercicio = sessoes.filter(s => s.exercicio_id === eid);
    const feitas = doExercicio.filter(s => s.fim && s.analise?.bracos?.afetado);

    // Situação atual: indicadores da última sessão, comparados com a primeira
    const ultima = feitas.at(-1), primeira = feitas.length > 1 ? feitas[0] : null;
    if (ultima) {
      const antes = primeira ? Object.fromEntries(indicadores(primeira.analise).map(i => [i.id, i])) : {};
      const nScore = nivel(ultima.score_geral, FAIXAS.score);
      $('#situacao').innerHTML = `
        <div class="cartao destaque">
          <div><div class="mudo pequeno">Score do braço afetado</div>
            <div class="numero">${num(ultima.score_geral, 0)}<small> / 100</small></div></div>
          <div class="extra">${chip(nScore)}
            <span>Braço saudável: <b>${num(doBraco(ultima, 'saudavel')?.score_geral, 0)}</b></span>
            ${primeira ? `<span>${tendencia(ultima.score_geral, primeira.score_geral, FAIXAS.score, 'desde a 1ª sessão')}</span>` : ''}</div>
          <a class="link" href="#/sessao/${ultima.id}">Ver sessão de ${dataCurta(ultima.inicio)} →</a>
        </div>
        <div class="indicadores">${indicadores(ultima.analise).map(i => cartaoIndicador(i, antes[i.id], 'desde a 1ª sessão')).join('')}</div>
        ${primeira ? `<p class="mudo pequeno">As setas comparam a última sessão com a 1ª (${dataCurta(primeira.inicio)}).</p>` : ''}`;
    } else {
      $('#situacao').innerHTML = '<p class="vazio">Ainda não há sessões concluídas deste exercício.</p>';
    }

    // Evolução
    graficos.forEach(g => g.destroy()); graficos = [];
    $('#semEvolucao').textContent = feitas.length > 1 ? '' : 'Os gráficos de evolução ficam mais úteis a partir da 2ª sessão concluída.';
    const rotulos = feitas.map((s, i) => `${i + 1}ª · ${dataCurta(s.inicio)}`);
    const linhaCategoria = (dados) => ({ type: 'line', data: { labels: rotulos, datasets: dados } });
    const porBraco = f => BRACOS.map(b => serie(b.nome, feitas.map(s => f(doBraco(s, b.k)) ?? null), b.cor, comPontos()));
    const amp = feitas.map(s => s.analise?.simetria?.excursao_pct ?? null);
    grafico('gSim', { ...linhaCategoria([serie('Amplitude do afetado (% do saudável)', amp, '--s2', { ...comPontos(), borderWidth: 3 })]),
      options: opcoes({ xTipo: 'category', yMin: 0, yMax: Math.max(110, ...amp.filter(v => v != null)), un: ' %', legenda: false,
        ref: { faixas: [{ de: 90, ate: 110, texto: 'faixa de simetria' }], linhas: [{ y: 100, texto: 'igual ao saudável' }] } }) });
    grafico('gScore', { ...linhaCategoria(porBraco(b => b?.score_geral)),
      options: opcoes({ xTipo: 'category', yMin: 0, yMax: 100, ref: { faixas: [{ de: FAIXAS.score.bom, ate: 100, texto: 'faixa boa' }] } }) });
    grafico('evAmp', { ...linhaCategoria(porBraco(b => b?.metricas?.excursao)), options: opcoes({ xTipo: 'category', yMin: 0, un: '°' }) });
    grafico('evRitmo', { ...linhaCategoria(porBraco(b => pct(b?.jogo?.aderencia_cadencia))),
      options: opcoes({ xTipo: 'category', yMin: 0, yMax: 100, un: ' %' }) });
    grafico('evControle', { ...linhaCategoria(porBraco(b => b?.metricas?.rmse_trajetoria)), options: opcoes({ xTipo: 'category', yMin: 0, un: '°' }) });
    const razaoSerie = (campo) => [serie('Afetado ÷ saudável', feitas.map(s => razao(doBraco(s, 'afetado')?.metricas?.[campo], doBraco(s, 'saudavel')?.metricas?.[campo])), '--s2', comPontos())];
    const refUm = { linhas: [{ y: 1, texto: 'igual ao saudável' }] };
    grafico('evFluidez', { ...linhaCategoria(razaoSerie('jerk_medio')), options: opcoes({ xTipo: 'category', yMin: 0, un: '×', legenda: false, ref: refUm }) });
    grafico('evTremor', { ...linhaCategoria(razaoSerie('rms_tremor')), options: opcoes({ xTipo: 'category', yMin: 0, un: '×', legenda: false, ref: refUm }) });

    // Histórico
    $('#tabelaSessoes').innerHTML = doExercicio.length ? `<table>
      <tr><th>Data</th><th>Score do afetado</th><th class="num">Amplitude</th><th class="num">No ritmo</th><th>Atenção</th><th></th></tr>
      ${doExercicio.slice().reverse().map(s => {
        const n = s.analise ? interpretar(s.analise, [], null).atencao.length : null;
        return `<tr ${s.fim ? `class="clicavel" data-href="#/sessao/${s.id}"` : ''}><td>${dataHora(s.inicio)}</td>
          <td>${s.fim ? `<b>${num(s.score_geral, 0)}</b> ${chip(nivel(s.score_geral, FAIXAS.score))}` : '<span class="mudo">em andamento</span>'}</td>
          <td class="num">${num(s.analise?.simetria?.excursao_pct, 0, ' %')}</td>
          <td class="num">${num(pct(doBraco(s, 'afetado')?.jogo?.aderencia_cadencia), 0, ' %')}</td>
          <td>${n == null ? '—' : n === 0 ? 'nenhum ponto' : `${n} ${n === 1 ? 'ponto' : 'pontos'}`}</td>
          <td class="num mudo">${s.fim ? '›' : ''}</td></tr>`;
      }).join('')}
    </table>
    <p class="mudo pequeno" style="margin:8px">Amplitude = braço afetado em % do saudável. Clique numa sessão para ver a análise.</p>` : '<p class="vazio">Nenhuma sessão ainda.</p>';
    document.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = () => { location.hash = tr.dataset.href; });
  }
  if (!comSessoes.length) return;
  if ($('#fExercicio')) $('#fExercicio').onchange = atualizar;
  atualizar();
  abas('paciente');
}

// ===================== TELA DA SESSÃO =====================
async function telaSessao(id) {
  const s = await api(`/api/sessions/${id}`);
  const [historicoEx, paciente] = await Promise.all([
    api(`/api/patients/${s.patient_id}/sessions?exercicio_id=${s.exercicio_id}`), api(`/api/patients/${s.patient_id}`)]);
  const anterior = historicoEx.filter(x => x.fim && x.analise?.bracos?.afetado && x.inicio < s.inicio).at(-1) || null;
  const a = s.analise, af = a?.bracos?.afetado || {}, sa = a?.bracos?.saudavel || {};
  const temAnalise = !!af.metricas;
  const ind = indicadores(a), antes = anterior ? Object.fromEntries(indicadores(anterior.analise).map(i => [i.id, i])) : {};
  const { atencao, destaques } = interpretar(a, s.series, anterior);
  const nScore = nivel(af.score_geral, FAIXAS.score);
  const corNivel = { bom: '--bom', atencao: '--atencao', alerta: '--alerta' };

  const ABAS = [temAnalise && ['indicadores', 'Indicadores'], temAnalise && ['comparacao', 'Comparação entre braços'],
                s.reps.length && ['repeticoes', 'Repetições'], ['series', 'Séries'], s.series.length && ['tecnico', 'Dados técnicos']].filter(Boolean);
  trilha([['Pacientes', '#/'], [paciente.nome, `#/paciente/${s.patient_id}`], [`Sessão de ${dataCurta(s.inicio)}`]]);

  app.innerHTML = `
    <div class="topo-pagina"><div>
      <h1>${esc(s.exercicio_nome || s.exercicio)}</h1>
      <p class="mudo pequeno">${dataHora(s.inicio)} · ${s.series_alvo} ${s.series_alvo === 1 ? 'série' : 'séries'} com cada braço${s.reps_alvo ? ` × ${s.reps_alvo} repetições` : ''}
        · ${num(s.cadencia_alvo, 0)} rep/min${anterior ? ` · comparada com ${dataCurta(anterior.inicio)}` : ' · 1ª sessão deste exercício'}</p>
    </div></div>

    ${!s.fim ? '<p class="cartao">Sessão em andamento. A análise aparece quando o jogo for encerrado.</p>' : `
    <section class="cartao resumo">
      <div class="score">
        <div class="mudo pequeno">Score do braço afetado</div>
        <div class="valor">${num(af.score_geral, 0)}<small> / 100</small></div>
        <div>${chip(nScore)}</div>
        <div class="medidor"><i style="width:${af.score_geral ?? 0}%;background:var(${corNivel[nScore] || '--neutro'})"></i></div>
        <p class="pequeno">Braço saudável: <b>${num(sa.score_geral, 0)}</b> / 100</p>
        ${anterior ? `<p class="pequeno">${tendencia(af.score_geral, anterior.analise.score_geral, FAIXAS.score, 'vs. sessão anterior')}</p>` : ''}
      </div>
      <div>
        <h2>O que observar</h2>
        ${!temAnalise ? '<p class="mudo">Não há leituras do haltere suficientes nesta sessão para a análise do movimento.</p>' : `
        <ul class="notas-texto">
          ${atencao.map(([n, t]) => `<li><span class="icone ${n}">${STATUS[n][0]}</span><span>${t}</span></li>`).join('')
            || '<li><span class="icone bom">✓</span><span>Nenhum ponto de atenção: todos os indicadores dentro da faixa esperada.</span></li>'}
          ${destaques.map(t => `<li><span class="icone bom">✓</span><span>${t}</span></li>`).join('')}
        </ul>`}
      </div>
    </section>`}

    <div class="barra"><div class="abas">${ABAS.map(([k, t]) => `<button data-aba="${k}">${t}</button>`).join('')}</div></div>

    ${temAnalise ? `<section data-painel="indicadores">
      <div class="indicadores">${ind.map(i => cartaoIndicador(i, antes[i.id], 'vs. sessão anterior')).join('')}</div>
    </section>

    <section data-painel="comparacao" hidden><div class="cartao"><div class="graficos">
      ${cartaoGrafico('gComparacao', 'Afetado × saudável em cada aspecto',
        'tudo em escala de 0 a 100, em que quanto maior a barra, melhor. A diferença entre a barra azul (saudável) e a laranja (afetado) mostra onde o braço afetado está mais atrás.', { alto: true })}
      ${cartaoGrafico('gRepeticao', 'Como é uma repetição média?',
        'cada linha é a média das repetições, do início (esquerda) ao fim (direita). Linha laranja mais baixa = o afetado não sobe tanto; pico deslocado para a direita = subida mais lenta. A linha tracejada é o movimento ideal.', { alto: true })}
    </div></div></section>` : ''}

    ${s.reps.length ? `<section data-painel="repeticoes" hidden><div class="cartao"><div class="graficos">
      ${cartaoGrafico('gAmpReps', 'Cada repetição alcançou a amplitude pedida?',
        '100 % = chegou à posição alta configurada para aquele braço. Barras bem abaixo da linha indicam repetições incompletas. S1·3 = série 1, 3ª repetição (passe o mouse para ver o braço). A 1ª repetição de cada série costuma ser menor porque parte do repouso.')}
      ${cartaoGrafico('gTempoReps', 'O ritmo foi mantido?',
        '100 % = repetição exatamente no tempo pedido. Pontos dentro da faixa verde estão no ritmo; acima = lento, abaixo = rápido. A 1ª repetição de cada série não tem tempo medido.')}
    </div></div></section>` : ''}

    <section data-painel="series" hidden><div class="cartao">
      <div class="serie-fadiga"><div class="tabela-rolavel">
      ${s.series.length ? `<table>
        <tr><th>Série</th><th>Braço</th><th class="num">Reps</th><th class="num">No ritmo</th><th class="num">Amplitude</th>
            <th class="num">Pontos</th><th>Score</th></tr>
        ${s.series.map(x => `<tr><td>${x.n}</td><td><span class="bolinha" style="background:var(${x.braco === 'afetado' ? '--s2' : '--s1'})"></span>${nomeBraco(x.braco)}</td>
          <td class="num">${x.total_reps ?? '—'}</td><td class="num">${num(pct(x.aderencia_cadencia), 0, ' %')}</td>
          <td class="num">${num(x.amp_media, 0, '°')}</td><td class="num">${x.pontuacao ?? '—'}</td>
          <td>${x.score_geral == null ? '—' : `${num(x.score_geral, 0)} ${chip(nivel(x.score_geral, FAIXAS.score))}`}</td></tr>`).join('')}
      </table>` : '<p class="vazio">Nenhuma série registrada.</p>'}
      </div>${s.series.length > 2 ? cartaoGrafico('gFadiga', 'Houve fadiga ao longo das séries?',
          'amplitude média de cada série. Uma linha que cai de uma série para a outra sugere cansaço.', { melhor: 'maior' }) : ''}</div>
    </div></section>

    ${s.series.length ? '<section data-painel="tecnico" hidden><div class="cartao" id="conteudoTecnico"></div></section>' : ''}
    ${glossario()}`;

  // ---- Gráficos de comparação ----
  const br = b => a?.bracos?.[b] || {};
  if (temAnalise) {
    const aspectos = [
      ['Amplitude (% da meta)', b => b.metricas?.amplitude_pct == null ? null : Math.min(100, b.metricas.amplitude_pct)],
      ['Ritmo (% no tempo)', b => pct(b.jogo?.aderencia_cadencia)],
      ['Controle do movimento', b => b.notas?.trajetoria],
      ['Fluidez', b => b.notas?.suavidade],
    ];
    grafico('gComparacao', { type: 'bar', data: { labels: aspectos.map(x => x[0]),
        datasets: BRACOS.map(b => serie(b.nome, aspectos.map(([, f]) => f(br(b.k)) ?? null), b.cor, { borderRadius: 4, barThickness: 14 })) },
      options: { ...opcoes({ horizontal: true, yMin: 0, yMax: 100, rotulos: true }), layout: { padding: { right: 28 } } } });
    const tau = (af.curva_media || sa.curva_media).map((_, i) => i);
    grafico('gRepeticao', { type: 'line', data: { datasets: [
        ...BRACOS.filter(b => br(b.k).curva_media).map(b => serie(b.nome, pontosXY(tau, br(b.k).curva_media), b.cor, { borderWidth: 3 })),
        ...(af.curva_ideal ? [serie('Movimento ideal (afetado)', pontosXY(tau, af.curva_ideal), '--neutro', { borderDash: [6, 5] })] : []),
      ] }, options: opcoes({ x: 'início → fim da repetição (%)', y: 'ângulo a partir da posição baixa (°)', un: '°', yMin: 0 }) });
  }

  // ---- Repetição por repetição ----
  if (s.reps.length) {
    const serieDe = Object.fromEntries(s.series.map(x => [x.id, x]));
    const reps = s.reps.filter(r => serieDe[r.serie_id]);
    const rotulos = reps.map(r => `S${serieDe[r.serie_id].n}·${r.n}`);
    const titulos = reps.map(r => `Série ${serieDe[r.serie_id].n} · braço ${nomeBraco(serieDe[r.serie_id].braco).toLowerCase()} · ${r.n}ª repetição`);
    const porBraco = f => BRACOS.map(b => serie(b.nome, reps.map(r => serieDe[r.serie_id].braco === b.k ? f(r, serieDe[r.serie_id]) : null), b.cor,
      { borderRadius: 3, grouped: false, maxBarThickness: 16 }));
    grafico('gAmpReps', { type: 'bar', data: { labels: rotulos,
        datasets: porBraco((r, x) => { const meta = Math.abs(x.amp_max - x.amp_min); return meta ? 100 * r.amplitude / meta : null; }) },
      options: opcoes({ xTipo: 'category', yMin: 0, un: ' % da meta', titulos, ref: { linhas: [{ y: 100, texto: 'meta' }] } }) });
    grafico('gTempoReps', { type: 'line', data: { labels: rotulos,
        datasets: porBraco(r => r.duracao_s == null ? null : 100 * r.duracao_s / (60 / r.cadencia)).map(d => ({ ...d, showLine: false, pointRadius: 5, pointHoverRadius: 7 })) },
      options: opcoes({ xTipo: 'category', yMin: 0, un: ' % do tempo pedido', titulos,
        ref: { faixas: [{ de: 80, ate: 120, texto: 'faixa do ritmo' }] } }) });
    const ns = [...new Set(s.series.map(x => x.n))];
    grafico('gFadiga', { type: 'line', data: { labels: ns.map(n => `Série ${n}`),
        datasets: BRACOS.map(b => serie(b.nome, ns.map(n => s.series.find(x => x.n === n && x.braco === b.k)?.amp_media ?? null), b.cor, comPontos())) },
      options: opcoes({ xTipo: 'category', yMin: 0, un: '°' }) });
  }

  // ---- Abas; os dados técnicos só são desenhados quando a aba é aberta ----
  abas('sessao', { tecnico: () => { if (!$('#conteudoTecnico').innerHTML) detalhesTecnicos(s); } });
}

function detalhesTecnicos(s) {
  const a = s.analise, af = a?.bracos?.afetado || {}, sa = a?.bracos?.saudavel || {};
  const LINHAS = [
    ['Excursão da trajetória média', b => b.metricas?.excursao, 1, '°'],
    ['Velocidade angular de pico', b => b.jogo?.vel_media, 0, ' °/s'],
    ['Velocidade linear de pico (5.5)', b => b.metricas?.vel_linear_pico, 2, ' m/s'],
    ['Erro de trajetória — RMSE (5.9)', b => b.metricas?.rmse_trajetoria, 1, '°'],
    ['Índice de suavidade (5.6)', b => b.metricas?.i_suavidade, 1, ' m/s²'],
    ['Jerk médio (5.6)', b => b.metricas?.jerk_medio, 2, ' m/s³'],
    ['Tremor — RMS (5.7)', b => b.metricas?.rms_tremor, 3, ' m/s²'],
    ['Nota de trajetória (5.10)', b => b.notas?.trajetoria, 0, ''],
    ['Nota de simetria (5.10)', b => b.notas?.simetria, 0, ''],
    ['Nota de suavidade (5.10)', b => b.notas?.suavidade, 0, ''],
  ];
  $('#conteudoTecnico').innerHTML = `
    <h2>Métricas por braço (memorial de cálculo)</h2>
    <div class="tabela-rolavel"><table><tr><th>Métrica (seção do memorial)</th><th class="num">Saudável</th><th class="num">Afetado</th></tr>
      ${LINHAS.map(([rot, f, casas, un]) => `<tr><td>${rot}</td><td class="num">${num(f(sa), casas, un)}</td><td class="num">${num(f(af), casas, un)}</td></tr>`).join('')}
      <tr><td>RMSE entre os braços (5.9)</td><td class="num" colspan="2">${num(a?.simetria?.rmse, 1, '°')}</td></tr>
      <tr><td>Atraso do ápice do afetado (5.9)</td><td class="num" colspan="2">${num(a?.simetria?.atraso_apice_pct, 0, ' % do ciclo')}</td></tr>
    </table></div>
    <h3 class="titulo-secao">Sinais de uma série</h3>
    <div class="filtros">Série <select id="selSerie">${s.series.map(x => `<option value="${x.id}">Série ${x.n} · ${nomeBraco(x.braco)}</option>`).join('')}</select></div>
    <div id="sinais"></div>`;
  const sel = $('#selSerie');
  sel.onchange = () => desenharSinais(+sel.value);
  desenharSinais(+sel.value);
}

let graficosSinais = [];
async function desenharSinais(serieId) {
  graficosSinais.forEach(g => g.destroy()); graficosSinais = [];
  const x = await api(`/api/series/${serieId}`), a = x.analise, m = a?.metricas || {};
  const tile = (rotulo, valor, metodo = '') =>
    `<div class="tile"><div class="rotulo">${rotulo}</div><div class="valor">${valor}</div><div class="metodo">${metodo}</div></div>`;
  $('#sinais').innerHTML = `
    ${a ? `<div class="tiles" style="margin-bottom:16px">
      ${tile('Score da série', num(a.score_geral, 0), 'sem a nota de simetria')}
      ${tile('Erro de trajetória', num(m.rmse_trajetoria, 1, '°'), 'RMSE vs. ideal (5.9)')}
      ${tile('Jerk médio', num(m.jerk_medio, 2, ' m/s³'), 'suavidade (5.6)')}
      ${tile('Tremor', num(m.rms_tremor, 3, ' m/s²'), 'RMS do resíduo (5.7)')}
    </div>
    <div class="graficos">
      <div><h3>Ângulo do haltere</h3><div class="caixa-grafico"><canvas id="gTheta"></canvas></div></div>
      <div><h3>Trajetória média vs. ideal</h3><div class="caixa-grafico"><canvas id="gTraj"></canvas></div></div>
      <div><h3>Aceleração linear: total e movimento lento</h3><div class="caixa-grafico"><canvas id="gAcel"></canvas></div></div>
      <div><h3>Tremor isolado (resíduo)</h3><div class="caixa-grafico"><canvas id="gTremor"></canvas></div></div>
      <div><h3>Jerk (m/s³)</h3><div class="caixa-grafico"><canvas id="gJerk"></canvas></div></div>
    </div>` : '<p class="mudo">Sem leituras brutas do haltere para esta série.</p>'}
    ${x.reps.length ? `<div class="graficos" style="margin-top:16px">
      <div><h3>Amplitude por repetição (°)</h3><div class="caixa-grafico"><canvas id="gAmp"></canvas></div></div>
      <div><h3>Duração de cada repetição vs. alvo (s)</h3><div class="caixa-grafico"><canvas id="gDur"></canvas></div></div>
    </div>` : ''}`;
  const g = (id, cfg) => grafico(id, cfg, graficosSinais);
  if (a) {
    const sn = a.sinais, t = sn.t, tau = a.curva_media.map((_, i) => i), corB = x.braco === 'afetado' ? '--s2' : '--s1';
    g('gTheta', { type: 'line', data: { datasets: [
        serie('Bruto', pontosXY(t, sn.theta), '--neutro', { borderWidth: 1.5 }),
        serie('Suavizado (K = 10)', pontosXY(t, sn.theta_suave), corB)] },
      options: opcoes({ x: 'tempo (s)', y: 'θ (°)', un: '°' }) });
    g('gTraj', { type: 'line', data: { datasets: [
        serie('Média das repetições', pontosXY(tau, a.curva_media), corB, { borderWidth: 3 }),
        serie('Ideal', pontosXY(tau, a.curva_ideal), '--neutro', { borderDash: [6, 5] })] },
      options: opcoes({ x: 'progresso τ (%)', y: 'excursão (°)', un: '°' }) });
    g('gAcel', { type: 'line', data: { datasets: [
        serie('Aceleração linear', pontosXY(t, sn.a_lin), '--neutro', { borderWidth: 1.5 }),
        serie('Movimento lento (K = 10)', pontosXY(t, sn.a_lenta), corB)] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s²', un: ' m/s²' }) });
    g('gTremor', { type: 'line', data: { datasets: [serie('Tremor', pontosXY(t, sn.tremor), corB, { borderWidth: 1.5 })] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s²', legenda: false, un: ' m/s²' }) });
    g('gJerk', { type: 'line', data: { datasets: [serie('Jerk', pontosXY(t, sn.jerk), corB, { borderWidth: 1.5 })] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s³', legenda: false, un: ' m/s³' }) });
  }
  if (x.reps.length) {
    const n = x.reps.map(r => r.n), corB = x.braco === 'afetado' ? '--s2' : '--s1';
    g('gAmp', { type: 'bar', data: { labels: n, datasets: [serie('Amplitude', x.reps.map(r => r.amplitude), corB, { borderRadius: 4, maxBarThickness: 28 })] },
      options: opcoes({ xTipo: 'category', x: 'repetição', legenda: false, un: '°' }) });
    g('gDur', { type: 'bar', data: { labels: n, datasets: [
        serie('Duração', x.reps.map(r => r.duracao_s), corB, { borderRadius: 4, maxBarThickness: 28 }),
        serie('Alvo (60 ÷ cadência)', x.reps.map(r => 60 / r.cadencia), '--neutro', { type: 'line', borderDash: [6, 5], pointRadius: 0 })] },
      options: opcoes({ xTipo: 'category', x: 'repetição', un: ' s' }) });
  }
}

// ===================== NAVEGAÇÃO =====================
async function rota() {
  [...graficos, ...graficosSinais].forEach(g => g.destroy()); graficos = []; graficosSinais = [];
  const [, tela, id] = location.hash.split('/');
  try {
    if (tela === 'login') return telaLogin();
    const { usuario } = await api('/api/me');
    if (!usuario) return (location.hash = '#/login');
    $('#sair').hidden = false;
    if (tela === 'paciente') return await telaPaciente(+id);
    if (tela === 'sessao') return await telaSessao(+id);
    await telaPacientes();
  } catch (erro) {
    app.innerHTML = `<p class="cartao erro">Não foi possível carregar: ${esc(erro.message)}</p>`;
  }
}
$('#sair').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.hash = '#/login'; };
if (window.Chart) Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
addEventListener('hashchange', rota);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rota);   // recolore os gráficos
rota();
</script>
