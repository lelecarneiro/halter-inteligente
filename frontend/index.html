<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halter Inteligente — Plataforma</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --fundo:#f3f3f1; --cartao:#fcfcfb; --borda:#e4e3df; --grade:#ecebe7;
    --txt:#0b0b0b; --txt2:#52514e; --mudo:#7b7a75; --acento:#2a78d6; --erro:#c62f2f;
    /* paleta categórica (ordem fixa) */
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --neutro:#9a9993;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --fundo:#121211; --cartao:#1a1a19; --borda:#2e2e2b; --grade:#262624;
      --txt:#f0efec; --txt2:#c3c2b7; --mudo:#8f8e86; --acento:#3987e5; --erro:#e66767;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --neutro:#77766f;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--txt); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--cartao); border-bottom:1px solid var(--borda); }
  header b { font-size:16px; } header span { color:var(--mudo); }
  header button { margin-left:auto; }
  main { max-width:1200px; margin:0 auto; padding:24px 16px 60px; }
  h1 { margin:4px 0 6px; font-size:26px; }
  h2 { margin:0 0 14px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--txt2); }
  h3 { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--txt); }
  a { color:var(--acento); text-decoration:none; } a:hover { text-decoration:underline; }
  .cartao { background:var(--cartao); border:1px solid var(--borda); border-radius:12px; padding:18px; margin-bottom:16px; }
  .mudo { color:var(--mudo); } .pequeno { font-size:13px; } .erro { color:var(--erro); }
  .voltar { display:inline-block; margin-bottom:4px; font-size:14px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--txt2); margin-bottom:12px; }
  input, select, textarea { width:100%; min-width:0; font:inherit; color:var(--txt); background:var(--fundo); border:1px solid var(--borda); border-radius:8px; padding:8px 10px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--borda); background:var(--cartao); color:var(--txt); cursor:pointer; }
  button.pri { background:var(--acento); border-color:var(--acento); color:#fff; font-weight:600; }
  .dupla { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grade2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grade-paciente { display:grid; grid-template-columns:340px 1fr; gap:16px; align-items:start; }
  .graficos { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .multiplos { display:grid; grid-template-columns:repeat(3,1fr); gap:18px 20px; }
  .caixa-grafico { position:relative; height:200px; } .caixa-grafico.alto { height:300px; }
  .login { max-width:360px; margin:60px auto; }
  .login button { width:100%; }
  .lista { list-style:none; margin:0; padding:0; }
  .lista li a { display:flex; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--borda); color:var(--txt); }
  .lista li a span { color:var(--mudo); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-weight:600; color:var(--txt2); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--borda); }
  td.num, th.num { text-align:right; }
  .filtros { display:flex; gap:10px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--txt2); }
  .filtros select { width:auto; padding:5px 8px; }
  /* Métricas */
  .heroi { display:grid; grid-template-columns:240px 1fr; gap:16px; }
  .score { display:flex; flex-direction:column; justify-content:center; }
  .score .valor { font-size:56px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .score .valor small { font-size:18px; font-weight:500; color:var(--mudo); }
  .medidor { height:8px; border-radius:4px; background:var(--grade); margin-top:12px; overflow:hidden; }
  .medidor i { display:block; height:100%; background:var(--acento); border-radius:4px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .tile { border:1px solid var(--borda); border-radius:10px; padding:12px; }
  .tile .rotulo { font-size:12px; color:var(--txt2); }
  .tile .valor { font-size:22px; font-weight:700; margin:2px 0; font-variant-numeric:tabular-nums; }
  .tile .metodo { font-size:12px; color:var(--mudo); }
  .tile .medidor { height:5px; margin-top:6px; }
  .titulo { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .titulo .acoes { margin-left:auto; display:flex; gap:8px; }
  .titulo h1 { margin-right:auto; }
  button.perigo { color:var(--erro); border-color:var(--erro); }
  .botoes { display:flex; gap:8px; }
  .sub-cartao { border:1px dashed var(--borda); border-radius:10px; padding:12px; margin:-4px 0 12px; }
  .bolinha { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .foco { text-transform:none; letter-spacing:0; color:var(--txt); }
  details summary { cursor:pointer; color:var(--acento); font-size:14px; }
  @media (max-width:900px) { .grade2, .grade-paciente, .graficos, .heroi { grid-template-columns:1fr; } .multiplos { grid-template-columns:1fr 1fr; } }
  @media (max-width:560px) { .multiplos, .dupla { grid-template-columns:1fr; } main { padding:16px; } }
</style>
</head>
<body>
<header>
  <b>Halter Inteligente</b><span>Plataforma do profissional</span>
  <button id="sair" hidden>Sair</button>
</header>
<main id="app"></main>

<script>
// ===================== UTILIDADES =====================
const $ = s => document.querySelector(s);
const app = $('#app');
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v, casas = 1, un = '') => v == null || !isFinite(v) ? '—'
  : (+v).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas }) + un;
const dataHora = iso => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const dataCurta = iso => new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
const nomeBraco = b => b === 'saudavel' ? 'Saudável' : 'Afetado';

async function api(url, opcoes = {}) {
  const r = await fetch(url, { method: opcoes.method || 'GET', headers: { 'Content-Type': 'application/json' },
                               body: opcoes.body && JSON.stringify(opcoes.body) });
  if (r.status === 401) { location.hash = '#/login'; throw new Error('faça login novamente'); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).erro || `erro ${r.status}`);
  return r.json();
}
// Envia um formulário tratando erros
const aoEnviar = (form, acao) => form.onsubmit = async e => {
  e.preventDefault();
  try { await acao(Object.fromEntries(new FormData(form))); } catch (erro) { alert(erro.message); }
};

// ===================== GRÁFICOS =====================
let graficos = [];
function grafico(id, config, lista = graficos) {
  const el = document.getElementById(id);
  if (el && window.Chart) lista.push(new Chart(el, config));   // sem internet para o CDN: só os gráficos somem
}
function opcoes({ x = '', y = '', xTipo = 'linear', legenda = true, yMin, yMax, un = '' } = {}) {
  const txt2 = cor('--txt2'), grade = cor('--grade');
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: legenda, align: 'start', labels: { color: txt2, boxWidth: 14, boxHeight: 3 } },
      tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${num(c.parsed.y, 2, un)}` } },
    },
    scales: {
      x: { type: xTipo, title: { display: !!x, text: x, color: txt2 }, ticks: { color: txt2, maxTicksLimit: 8 },
           grid: { display: false }, border: { color: grade } },
      y: { min: yMin, max: yMax, title: { display: !!y, text: y, color: txt2 }, ticks: { color: txt2, maxTicksLimit: 6 },
           grid: { color: grade }, border: { display: false } },
    },
    elements: { point: { radius: 0, hoverRadius: 4 }, line: { borderWidth: 2, tension: 0 } },
  };
}
const serie = (label, data, varCor, extra = {}) => ({ label, data, borderColor: cor(varCor), backgroundColor: cor(varCor), ...extra });
const pontosXY = (xs, ys, escala = 1) => xs.map((x, i) => ({ x, y: ys[i] == null ? null : ys[i] * escala }));

// ===================== TELAS =====================
function telaLogin() {
  $('#sair').hidden = true;
  app.innerHTML = `
    <form class="cartao login" id="fLogin">
      <h2>Entrar</h2>
      <label>Usuário<input name="usuario" required autocomplete="username"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro" id="msg"></p>
      <button class="pri">Entrar</button>
    </form>`;
  $('#fLogin').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                          body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
    if (r.ok) location.hash = '#/'; else $('#msg').textContent = 'Usuário ou senha incorretos.';
  };
}

async function telaPacientes() {
  const lista = await api('/api/patients');
  app.innerHTML = `
    <h1>Pacientes</h1>
    <div class="grade2">
      <section class="cartao">
        <h2>Selecionar paciente</h2>
        ${lista.length ? `<ul class="lista">${lista.map(p => `
          <li><a href="#/paciente/${p.id}"><b>${esc(p.nome)}</b>
          <span>${p.sessoes} ${p.sessoes === 1 ? 'sessão' : 'sessões'} · última: ${dataHora(p.ultima_sessao)}</span></a></li>`).join('')}</ul>`
        : '<p class="mudo">Nenhum paciente cadastrado ainda.</p>'}
      </section>
      <form class="cartao" id="fPaciente">
        <h2>Novo paciente</h2>
        <label>Nome<input name="nome" required></label>
        <label>Data de nascimento<input name="nascimento" type="date"></label>
        <label>Observações clínicas<textarea name="observacoes" rows="3"></textarea></label>
        <button class="pri">Cadastrar</button>
      </form>
    </div>`;
  aoEnviar($('#fPaciente'), async dados => {
    const { id } = await api('/api/patients', { method: 'POST', body: dados });
    location.hash = `#/paciente/${id}`;
  });
}

// Cores fixas por braço em toda a plataforma (e no jogo): saudável = azul, afetado = laranja
const BRACOS = [{ k: 'saudavel', nome: 'Saudável', cor: '--s1' }, { k: 'afetado', nome: 'Afetado', cor: '--s2' }];
const doBraco = (s, b) => s.analise?.bracos?.[b];
const pct = v => v == null ? null : v * 100;

// Métricas acompanhadas ao longo das sessões (uma por gráfico: unidades diferentes nunca dividem eixo)
const EVOLUCAO = [
  { id: 'amp', nome: 'Amplitude média (°)', v: (s, b) => doBraco(s, b)?.jogo?.amp_media, un: '°' },
  { id: 'ritmo', nome: 'Repetições no ritmo (%)', v: (s, b) => pct(doBraco(s, b)?.jogo?.aderencia_cadencia), un: ' %' },
  { id: 'traj', nome: 'Erro de trajetória — RMSE (°)', v: (s, b) => doBraco(s, b)?.metricas?.rmse_trajetoria, un: '°' },
  { id: 'tremor', nome: 'Tremor — RMS (m/s²)', v: (s, b) => doBraco(s, b)?.metricas?.rms_tremor, un: ' m/s²' },
  { id: 'jerk', nome: 'Jerk médio (m/s³)', v: (s, b) => doBraco(s, b)?.metricas?.jerk_medio, un: ' m/s³' },
  { id: 'sx', nome: 'Compensação lateral — Sx (cm)', v: (s, b) => pct(doBraco(s, b)?.metricas?.s_x), un: ' cm' },
];
const NOTAS = [
  { k: 'trajetoria', nome: 'Trajetória', peso: 30, cor: '--s2', metodo: 'RMSE vs. trajetória ideal' },
  { k: 'simetria', nome: 'Simetria', peso: 30, cor: '--s3', metodo: 'RMSE vs. braço saudável na sessão' },
  { k: 'estabilidade', nome: 'Estabilidade', peso: 25, cor: '--s4', metodo: 'Desvio padrão lateral Sx' },
  { k: 'suavidade', nome: 'Suavidade', peso: 15, cor: '--s5', metodo: 'Jerk médio' },
];

async function telaPaciente(id) {
  const [p, sessoes, exercicios] = await Promise.all([
    api(`/api/patients/${id}`), api(`/api/patients/${id}/sessions`), api('/api/exercicios')]);
  const exercicio = eid => exercicios.find(e => e.id === eid);
  const ultimaDe = eid => sessoes.filter(s => s.exercicio_id === eid).at(-1);
  const comSessoes = exercicios.filter(e => sessoes.some(s => s.exercicio_id === e.id));
  let foco = sessoes.at(-1)?.exercicio_id ?? exercicios[0]?.id;     // exercício mais recente do paciente
  const opcoesExercicio = sel => exercicios.map(e =>
    `<option value="${e.id}" ${e.id === sel ? 'selected' : ''}>${esc(e.nome)}${e.padrao ? '' : ' (personalizada)'}</option>`).join('');

  app.innerHTML = `
    <a class="voltar" href="#/">← Pacientes</a>
    <div class="titulo">
      <h1>${esc(p.nome)}</h1>
      <div class="acoes"><button id="btEditar">Editar</button><button id="btExcluir" class="perigo">Excluir paciente</button></div>
    </div>
    <p class="mudo">${p.nascimento ? 'Nascimento: ' + new Date(p.nascimento + 'T00:00').toLocaleDateString('pt-BR') + ' · ' : ''}${esc(p.observacoes || '')}</p>

    <form class="cartao" id="fEditar" hidden>
      <h2>Editar paciente</h2>
      <div class="grade2">
        <label>Nome<input name="nome" value="${esc(p.nome)}" required></label>
        <label>Data de nascimento<input name="nascimento" type="date" value="${esc(p.nascimento || '')}"></label>
      </div>
      <label>Observações clínicas<textarea name="observacoes" rows="3">${esc(p.observacoes || '')}</textarea></label>
      <div class="botoes"><button class="pri">Salvar</button><button type="button" id="btCancelarEdicao">Cancelar</button></div>
    </form>

    <div class="grade-paciente">
      <form class="cartao" id="fSessao">
        <h2>Nova sessão</h2>
        <label>Exercício<select name="exercicio_id" id="selExercicio">${opcoesExercicio(foco)}
          <option value="nova">+ Nova categoria…</option></select></label>
        <div class="sub-cartao" id="novaCategoria" hidden>
          <label>Nome da nova categoria<input id="novoNome" maxlength="60" placeholder="Ex.: Abdução horizontal de ombro"></label>
          <label>Descrição (opcional)<input id="novaDescricao" maxlength="200" placeholder="Como o movimento é feito"></label>
          <div class="botoes"><button type="button" class="pri" id="btCriarCategoria">Criar categoria</button>
            <button type="button" id="btCancelarCategoria">Cancelar</button></div>
        </div>
        <p class="mudo pequeno" id="descExercicio"></p>
        <div class="dupla">
          <label>Nº de séries<input name="series_alvo" type="number" min="1" max="10" required></label>
          <label>Repetições por série<input name="reps_alvo" type="number" min="1" max="200" placeholder="livre"></label>
        </div>
        <label>Cada série começa pelo braço<select name="ordem">
          <option value="saudavel">Saudável → depois o afetado</option><option value="afetado">Afetado → depois o saudável</option></select></label>
        <div class="dupla">
          <label>Cadência (rep/min)<input name="cadencia_alvo" type="number" min="4" max="30" required></label>
          <label>Duração máx. (min/série)<input name="duracao_min" type="number" min="1" max="30" required></label>
        </div>
        <div class="dupla">
          <label>Posição baixa (°)<input name="amp_min" type="number" required></label>
          <label>Posição alta (°)<input name="amp_max" type="number" required></label>
        </div>
        <button class="pri">Criar sessão e abrir o jogo</button>
        <p class="mudo pequeno" id="resumoPlano"></p>
      </form>

      <section class="cartao">
        <h2>Evolução — <span class="foco"></span></h2>
        ${comSessoes.length > 1 ? `<div class="filtros">Exercício
          <select id="fExercicio">${comSessoes.map(e => `<option value="${e.id}" ${e.id === foco ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>
        </div>` : ''}
        <h3>Score geral por braço (0 a 100)</h3>
        <div class="caixa-grafico alto"><canvas id="gScore"></canvas></div>
        <h3 style="margin-top:16px">Amplitude do braço afetado em % do saudável</h3>
        <div class="caixa-grafico"><canvas id="gSimetria"></canvas></div>
        <p class="mudo pequeno" id="semEvolucao"></p>
      </section>
    </div>

    <section class="cartao">
      <h2>Métricas por sessão — <span class="foco"></span></h2>
      <div class="multiplos">${EVOLUCAO.map(m => `<div><h3>${m.nome}</h3><div class="caixa-grafico"><canvas id="ev_${m.id}"></canvas></div></div>`).join('')}</div>
    </section>

    <section class="cartao">
      <h2>Histórico de sessões — <span class="foco"></span></h2>
      <div id="tabelaSessoes"></div>
    </section>`;

  // ---- Editar e excluir paciente ----
  $('#btEditar').onclick = () => { $('#fEditar').hidden = false; $('#fEditar [name=nome]').focus(); };
  $('#btCancelarEdicao').onclick = () => { $('#fEditar').hidden = true; };
  aoEnviar($('#fEditar'), async dados => { await api(`/api/patients/${id}`, { method: 'PUT', body: dados }); rota(); });
  $('#btExcluir').onclick = async () => {
    const aviso = `Excluir ${p.nome}${sessoes.length ? ` e as ${sessoes.length} sessões registradas (com todas as leituras do haltere)` : ''}?\n\nEsta ação não pode ser desfeita.`;
    if (!confirm(aviso)) return;
    try { await api(`/api/patients/${id}`, { method: 'DELETE' }); location.hash = '#/'; } catch (e) { alert(e.message); }
  };

  // ---- Formulário de nova sessão: categoria e valores da última sessão desse exercício ----
  const form = $('#fSessao'), sel = $('#selExercicio');
  const resumirPlano = () => {
    const n = +form.series_alvo.value || 0, r = +form.reps_alvo.value;
    const [a, b] = form.ordem.value === 'afetado' ? ['afetado', 'saudável'] : ['saudável', 'afetado'];
    $('#resumoPlano').textContent = n ? `${n} ${n === 1 ? 'série' : 'séries'} × 2 braços = ${2 * n} etapas no jogo`
      + (r ? ` (${r} repetições cada, ${2 * n * r} no total)` : '') + `. Em cada série: braço ${a}, depois braço ${b}.` : '';
  };
  function preencher() {
    const e = exercicio(+sel.value), u = ultimaDe(+sel.value) || {};
    form.cadencia_alvo.value = u.cadencia_alvo || 12; form.reps_alvo.value = u.reps_alvo || 10;
    form.series_alvo.value = u.series_alvo || 3; form.ordem.value = u.ordem || 'saudavel';
    form.amp_min.value = u.amp_min ?? 0; form.amp_max.value = u.amp_max ?? 60; form.duracao_min.value = u.duracao_min || 2;
    $('#descExercicio').innerHTML = esc(e?.descricao || '') + (e && !e.padrao && !e.sessoes
      ? ` <a href="#" id="lkExcluirCategoria">Excluir esta categoria</a>` : '');
    const lk = $('#lkExcluirCategoria');
    if (lk) lk.onclick = async ev => {
      ev.preventDefault();
      if (!confirm(`Excluir a categoria "${e.nome}"?`)) return;
      try { await api(`/api/exercicios/${e.id}`, { method: 'DELETE' }); rota(); } catch (erro) { alert(erro.message); }
    };
    resumirPlano();
  }
  form.oninput = resumirPlano;
  let anterior = sel.value;
  sel.onchange = () => {
    const nova = sel.value === 'nova';
    $('#novaCategoria').hidden = !nova;
    if (nova) return $('#novoNome').focus();
    anterior = sel.value; preencher();
  };
  $('#btCancelarCategoria').onclick = () => { sel.value = anterior; $('#novaCategoria').hidden = true; };
  $('#btCriarCategoria').onclick = async () => {
    try {
      const nova = await api('/api/exercicios', { method: 'POST', body: { nome: $('#novoNome').value, descricao: $('#novaDescricao').value } });
      exercicios.push({ ...nova, descricao: $('#novaDescricao').value, padrao: 0, sessoes: 0 });
      sel.innerHTML = opcoesExercicio(nova.id) + '<option value="nova">+ Nova categoria…</option>';
      anterior = sel.value; $('#novaCategoria').hidden = true; $('#novoNome').value = $('#novaDescricao').value = '';
      preencher();
    } catch (erro) { alert(erro.message); }
  };
  aoEnviar(form, async dados => {
    if (dados.exercicio_id === 'nova') throw new Error('Crie a categoria ou escolha um exercício da lista.');
    const { jogo } = await api('/api/sessions', { method: 'POST', body: { ...dados, patient_id: id } });
    location.href = jogo;                          // abre o jogo já configurado
  });
  preencher();

  // ---- Evolução e histórico: sempre de um exercício por vez, com os dois braços ----
  function atualizar() {
    const eid = $('#fExercicio') ? +$('#fExercicio').value : comSessoes[0]?.id ?? null;
    const doExercicio = sessoes.filter(s => s.exercicio_id === eid);
    document.querySelectorAll('.foco').forEach(el => el.textContent = exercicio(eid)?.nome || 'sem sessões');
    desenharEvolucao(doExercicio);
    const par = (s, f, casas, un) => BRACOS.map(b => num(f(doBraco(s, b.k)), casas, un)).join(' · ');
    $('#tabelaSessoes').innerHTML = doExercicio.length ? `<table>
      <tr><th>Data</th><th class="num">Séries</th><th class="num">Reps<br><span class="mudo">saud. · afet.</span></th>
          <th class="num">Amplitude<br><span class="mudo">saud. · afet.</span></th><th class="num">Afetado vs. saudável</th>
          <th class="num">Score<br><span class="mudo">saud. · afet.</span></th><th></th></tr>
      ${doExercicio.slice().reverse().map(s => `<tr>
        <td>${dataHora(s.inicio)}</td><td class="num">${s.series_alvo ?? '—'}</td>
        <td class="num">${par(s, b => b?.jogo?.total_reps, 0, '')}</td>
        <td class="num">${par(s, b => b?.jogo?.amp_media, 0, '°')}</td>
        <td class="num">${num(s.analise?.simetria?.excursao_pct, 0, ' %')}</td>
        <td class="num"><b>${par(s, b => b?.score_geral, 0, '')}</b></td>
        <td class="num">${s.fim ? `<a href="#/sessao/${s.id}">Ver análise</a>` : '<span class="mudo">em andamento</span>'}</td></tr>`).join('')}
    </table>` : '<p class="mudo">Nenhuma sessão ainda.</p>';
  }
  if ($('#fExercicio')) $('#fExercicio').onchange = atualizar;
  atualizar();
}

function desenharEvolucao(sessoes) {
  graficos.forEach(g => g.destroy()); graficos = [];
  const feitas = sessoes.filter(s => s.fim && s.analise);
  const rotulos = feitas.map((s, i) => `${i + 1}ª · ${dataCurta(s.inicio)}`);
  $('#semEvolucao').textContent = feitas.length ? '' : 'A evolução aparece após a primeira sessão concluída deste exercício.';
  const comPontos = { pointRadius: 4, pointHoverRadius: 6, spanGaps: true, pointBorderColor: cor('--cartao'), pointBorderWidth: 2 };
  const porBraco = f => BRACOS.map(b => serie(b.nome, feitas.map(s => f(s, b.k) ?? null), b.cor, comPontos));
  grafico('gScore', { type: 'line', data: { labels: rotulos, datasets: porBraco((s, b) => doBraco(s, b)?.score_geral) },
    options: opcoes({ xTipo: 'category', yMin: 0, yMax: 100 }) });
  grafico('gSimetria', { type: 'line', data: { labels: rotulos, datasets: [
      serie('Amplitude do afetado (% do saudável)', feitas.map(s => s.analise?.simetria?.excursao_pct ?? null), '--s3', comPontos),
      serie('Igual ao saudável (100 %)', feitas.map(() => 100), '--neutro', { borderDash: [6, 5], pointRadius: 0 }),
    ] }, options: opcoes({ xTipo: 'category', yMin: 0, un: ' %' }) });
  for (const m of EVOLUCAO) {
    grafico('ev_' + m.id, { type: 'line', data: { labels: rotulos, datasets: porBraco(m.v) },
      options: opcoes({ xTipo: 'category', un: m.un }) });
  }
}

async function telaSessao(id) {
  const s = await api(`/api/sessions/${id}`);
  const a = s.analise, sim = a?.simetria;
  const br = b => a?.bracos?.[b] || {};
  const af = br('afetado'), sa = br('saudavel');
  const tile = (rotulo, valor, metodo = '') =>
    `<div class="tile"><div class="rotulo">${rotulo}</div><div class="valor">${valor}</div><div class="metodo">${metodo}</div></div>`;
  // Tabela lado a lado: [rótulo, valor do braço, casas, unidade, quanto menor melhor?]
  const LINHAS = [
    ['Repetições', b => b.jogo?.total_reps, 0, ''],
    ['Repetições no ritmo', b => pct(b.jogo?.aderencia_cadencia), 0, ' %'],
    ['Amplitude média (jogo)', b => b.jogo?.amp_media, 1, '°'],
    ['Excursão da trajetória média', b => b.metricas?.excursao, 1, '°'],
    ['Velocidade angular de pico', b => b.jogo?.vel_media, 0, ' °/s'],
    ['Velocidade linear de pico (5.5)', b => b.metricas?.vel_linear_pico, 2, ' m/s'],
    ['Erro de trajetória — RMSE (5.9)', b => b.metricas?.rmse_trajetoria, 1, '°'],
    ['Índice de suavidade (5.6)', b => b.metricas?.i_suavidade, 1, ''],
    ['Jerk médio (5.6)', b => b.metricas?.jerk_medio, 2, ' m/s³'],
    ['Tremor — RMS (5.7)', b => b.metricas?.rms_tremor, 3, ' m/s²'],
    ['Compensação lateral — Sx (5.8)', b => pct(b.metricas?.s_x), 2, ' cm'],
    ['Posição lateral média μx (5.8)', b => pct(b.metricas?.mu_x), 2, ' cm'],
    ['Pontuação no jogo', b => b.jogo?.pontuacao, 0, ''],
    ['Score geral', b => b.score_geral, 0, ''],
  ];
  const razao = (x, y) => x == null || y == null || !y ? '—' : num(100 * x / y, 0, ' %');

  app.innerHTML = `
    <a class="voltar" href="#/paciente/${s.patient_id}">← Paciente</a>
    <h1>Sessão de ${dataHora(s.inicio)}</h1>
    <p class="mudo">${esc(s.exercicio_nome || s.exercicio)} · ${s.series_alvo} ${s.series_alvo === 1 ? 'série' : 'séries'} por braço
      ${s.reps_alvo ? `× ${s.reps_alvo} repetições` : ''} · cadência alvo ${num(s.cadencia_alvo, 0)} rep/min
      · amplitude alvo ${num(s.amp_min, 0)}° a ${num(s.amp_max, 0)}°</p>

    ${!s.fim ? '<p class="cartao">Sessão em andamento. A análise aparece quando o jogo for encerrado.</p>' : `
    <section class="cartao heroi">
      <div class="score">
        <h2>Score geral · braço afetado</h2>
        <div class="valor">${num(af.score_geral, 0)}<small> / 100</small></div>
        <div class="medidor"><i style="width:${af.score_geral ?? 0}%"></i></div>
        <p class="mudo pequeno">Braço saudável: <b>${num(sa.score_geral, 0)}</b> / 100</p>
      </div>
      <div class="tiles">${NOTAS.map(n => {
        const v = af.notas?.[n.k];
        return `<div class="tile"><div class="rotulo">${n.nome} · peso ${n.peso} %</div>
          <div class="valor">${num(v, 0)}</div><div class="metodo">${n.metodo}</div>
          <div class="medidor"><i style="width:${v ?? 0}%;background:var(${n.cor})"></i></div></div>`;
      }).join('')}</div>
    </section>
    ${a && !af.metricas ? '<p class="cartao mudo">Não há leituras brutas suficientes do haltere nesta sessão. Abaixo, apenas as métricas do jogo.</p>' : ''}

    <section class="cartao">
      <h2>Comparação entre os braços</h2>
      <div class="tiles" style="margin-bottom:16px">
        ${tile('Amplitude do afetado', num(sim?.excursao_pct, 0, ' % do saudável'), 'excursão média da trajetória')}
        ${tile('Diferença entre as trajetórias', num(sim?.rmse, 1, '°'), 'RMSE afetado vs. saudável (5.9)')}
        ${tile('Atraso do ápice', sim?.atraso_apice_pct == null ? '—' : num(sim.atraso_apice_pct, 0, ' % do ciclo'), 'positivo = afetado chega depois')}
        ${tile('Score: afetado vs. saudável', razao(af.score_geral, sa.score_geral), 'score do afetado em % do saudável')}
      </div>
      <div class="graficos">
        <div><h3>Trajetória média por repetição</h3><div class="caixa-grafico alto"><canvas id="gTrajBracos"></canvas></div></div>
        <div><h3>Notas por braço (0 a 100)</h3><div class="caixa-grafico alto"><canvas id="gNotasBracos"></canvas></div></div>
        <div><h3>Amplitude média por série (°)</h3><div class="caixa-grafico"><canvas id="gAmpSeries"></canvas></div></div>
        <div><h3>Score de movimento por série</h3><div class="caixa-grafico"><canvas id="gScoreSeries"></canvas></div></div>
      </div>
      <h3 style="margin-top:18px">Métricas lado a lado</h3>
      <table>
        <tr><th>Métrica</th><th class="num">Saudável</th><th class="num">Afetado</th><th class="num">Afetado em % do saudável</th></tr>
        ${LINHAS.map(([rot, f, casas, un]) => `<tr><td>${rot}</td><td class="num">${num(f(sa), casas, un)}</td>
          <td class="num">${num(f(af), casas, un)}</td><td class="num">${razao(f(af), f(sa))}</td></tr>`).join('')}
      </table>
    </section>`}

    <section class="cartao">
      <h2>Séries</h2>
      ${s.series.length ? `<table>
        <tr><th>Série</th><th>Braço</th><th class="num">Reps</th><th class="num">No ritmo</th><th class="num">Amplitude</th>
            <th class="num">Obstáculos</th><th class="num">Pontos</th><th class="num">Score</th><th></th></tr>
        ${s.series.map(x => `<tr><td>${x.n}</td><td><span class="bolinha" style="background:var(${x.braco === 'afetado' ? '--s2' : '--s1'})"></span>${nomeBraco(x.braco)}</td>
          <td class="num">${x.total_reps ?? '—'}</td><td class="num">${num(pct(x.aderencia_cadencia), 0, ' %')}</td>
          <td class="num">${num(x.amp_media, 1, '°')}</td><td class="num">${esc(x.obstaculos ?? '—')}</td>
          <td class="num">${x.pontuacao ?? '—'}</td><td class="num"><b>${num(x.score_geral, 0)}</b></td>
          <td class="num"><a href="#" data-serie="${x.id}">Ver sinais</a></td></tr>`).join('')}
      </table>` : '<p class="mudo">Nenhuma série registrada.</p>'}
    </section>

    ${s.series.length ? `<section class="cartao" id="secaoSinais">
      <h2>Sinais de uma série</h2>
      <div class="filtros">Série <select id="selSerie">${s.series.map(x => `<option value="${x.id}">Série ${x.n} · ${nomeBraco(x.braco)}</option>`).join('')}</select></div>
      <div id="sinais"></div>
    </section>` : ''}`;

  if (a) {
    const tau = (af.curva_media || sa.curva_media || []).map((_, i) => i);
    grafico('gTrajBracos', { type: 'line', data: { datasets: [
        ...BRACOS.filter(b => br(b.k).curva_media).map(b => serie(b.nome, pontosXY(tau, br(b.k).curva_media), b.cor, { borderWidth: 3 })),
        ...(af.curva_ideal ? [serie('Ideal (amplitude do afetado)', pontosXY(tau, af.curva_ideal), '--neutro', { borderDash: [6, 5] })] : []),
      ] }, options: opcoes({ x: 'progresso da repetição τ (%)', y: 'excursão a partir da posição baixa (°)', un: '°' }) });
    const cats = ['Trajetória', 'Estabilidade', 'Suavidade', 'Score geral'];
    const valores = b => [b.notas?.trajetoria, b.notas?.estabilidade, b.notas?.suavidade, b.score_geral].map(v => v ?? null);
    grafico('gNotasBracos', { type: 'bar', data: { labels: cats,
        datasets: BRACOS.map(b => serie(b.nome, valores(br(b.k)), b.cor, { borderRadius: 4, maxBarThickness: 34 })) },
      options: opcoes({ xTipo: 'category', yMin: 0, yMax: 100 }) });
  }
  const ns = [...new Set(s.series.map(x => x.n))];
  const porSerie = f => BRACOS.map(b => serie(b.nome, ns.map(n => f(s.series.find(x => x.n === n && x.braco === b.k)) ?? null), b.cor,
    { pointRadius: 4, spanGaps: true, pointBorderColor: cor('--cartao'), pointBorderWidth: 2 }));
  grafico('gAmpSeries', { type: 'line', data: { labels: ns.map(n => `Série ${n}`), datasets: porSerie(x => x?.amp_media) },
    options: opcoes({ xTipo: 'category', un: '°' }) });
  grafico('gScoreSeries', { type: 'line', data: { labels: ns.map(n => `Série ${n}`), datasets: porSerie(x => x?.score_geral) },
    options: opcoes({ xTipo: 'category', yMin: 0, yMax: 100 }) });

  // ---- Sinais de uma série (carregados sob demanda) ----
  const sel = $('#selSerie');
  if (!sel) return;
  sel.onchange = () => desenharSinais(+sel.value);
  document.querySelectorAll('[data-serie]').forEach(lk => lk.onclick = e => {
    e.preventDefault(); sel.value = lk.dataset.serie; desenharSinais(+sel.value);
    $('#secaoSinais').scrollIntoView({ behavior: 'smooth' });
  });
  desenharSinais(+sel.value);
}

let graficosSinais = [];
async function desenharSinais(serieId) {
  graficosSinais.forEach(g => g.destroy()); graficosSinais = [];
  const x = await api(`/api/series/${serieId}`), a = x.analise, m = a?.metricas || {};
  const tile = (rotulo, valor, metodo = '') =>
    `<div class="tile"><div class="rotulo">${rotulo}</div><div class="valor">${valor}</div><div class="metodo">${metodo}</div></div>`;
  $('#sinais').innerHTML = `
    ${a ? `<div class="tiles" style="margin-bottom:16px">
      ${tile('Score da série', num(a.score_geral, 0), 'sem a nota de simetria')}
      ${tile('Erro de trajetória', num(m.rmse_trajetoria, 1, '°'), 'RMSE vs. ideal (5.9)')}
      ${tile('Jerk médio', num(m.jerk_medio, 2, ' m/s³'), 'suavidade (5.6)')}
      ${tile('Tremor', num(m.rms_tremor, 3, ' m/s²'), 'RMS do resíduo (5.7)')}
      ${tile('Compensação lateral Sx', num(pct(m.s_x), 2, ' cm'), 'eixo X (5.8)')}
    </div>
    <div class="graficos">
      <div><h3>Ângulo do haltere</h3><div class="caixa-grafico"><canvas id="gTheta"></canvas></div></div>
      <div><h3>Trajetória média vs. ideal</h3><div class="caixa-grafico"><canvas id="gTraj"></canvas></div></div>
      <div><h3>Aceleração linear: total e movimento lento</h3><div class="caixa-grafico"><canvas id="gAcel"></canvas></div></div>
      <div><h3>Tremor isolado (resíduo)</h3><div class="caixa-grafico"><canvas id="gTremor"></canvas></div></div>
      <div><h3>Jerk (m/s³)</h3><div class="caixa-grafico"><canvas id="gJerk"></canvas></div></div>
      <div><h3>Deslocamento lateral — eixo X (cm)</h3><div class="caixa-grafico"><canvas id="gPx"></canvas></div></div>
    </div>` : '<p class="mudo">Sem leituras brutas do haltere para esta série.</p>'}
    ${x.reps.length ? `<div class="graficos" style="margin-top:16px">
      <div><h3>Amplitude por repetição (°)</h3><div class="caixa-grafico"><canvas id="gAmp"></canvas></div></div>
      <div><h3>Duração de cada repetição vs. alvo (s)</h3><div class="caixa-grafico"><canvas id="gDur"></canvas></div></div>
    </div>` : ''}`;
  const g = (id, cfg) => grafico(id, cfg, graficosSinais);
  if (a) {
    const sn = a.sinais, t = sn.t, tau = a.curva_media.map((_, i) => i), corB = x.braco === 'afetado' ? '--s2' : '--s1';
    g('gTheta', { type: 'line', data: { datasets: [
        serie('Bruto', pontosXY(t, sn.theta), '--neutro', { borderWidth: 1.5 }),
        serie('Suavizado (K = 10)', pontosXY(t, sn.theta_suave), corB)] },
      options: opcoes({ x: 'tempo (s)', y: 'θ (°)', un: '°' }) });
    g('gTraj', { type: 'line', data: { datasets: [
        serie('Média das repetições', pontosXY(tau, a.curva_media), corB, { borderWidth: 3 }),
        serie('Ideal', pontosXY(tau, a.curva_ideal), '--neutro', { borderDash: [6, 5] })] },
      options: opcoes({ x: 'progresso τ (%)', y: 'excursão (°)', un: '°' }) });
    g('gAcel', { type: 'line', data: { datasets: [
        serie('Aceleração linear', pontosXY(t, sn.a_lin), '--neutro', { borderWidth: 1.5 }),
        serie('Movimento lento (K = 10)', pontosXY(t, sn.a_lenta), corB)] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s²', un: ' m/s²' }) });
    g('gTremor', { type: 'line', data: { datasets: [serie('Tremor', pontosXY(t, sn.tremor), corB, { borderWidth: 1.5 })] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s²', legenda: false, un: ' m/s²' }) });
    g('gJerk', { type: 'line', data: { datasets: [serie('Jerk', pontosXY(t, sn.jerk), corB, { borderWidth: 1.5 })] },
      options: opcoes({ x: 'tempo (s)', y: 'm/s³', legenda: false, un: ' m/s³' }) });
    g('gPx', { type: 'line', data: { datasets: [serie('Posição lateral', pontosXY(t, sn.px, 100), corB)] },
      options: opcoes({ x: 'tempo (s)', y: 'cm', legenda: false, un: ' cm' }) });
  }
  if (x.reps.length) {
    const n = x.reps.map(r => r.n), corB = x.braco === 'afetado' ? '--s2' : '--s1';
    g('gAmp', { type: 'bar', data: { labels: n, datasets: [serie('Amplitude', x.reps.map(r => r.amplitude), corB, { borderRadius: 4, maxBarThickness: 28 })] },
      options: opcoes({ xTipo: 'category', x: 'repetição', legenda: false, un: '°' }) });
    g('gDur', { type: 'bar', data: { labels: n, datasets: [
        serie('Duração', x.reps.map(r => r.duracao_s), corB, { borderRadius: 4, maxBarThickness: 28 }),
        serie('Alvo (60 ÷ cadência)', x.reps.map(r => 60 / r.cadencia), '--neutro', { type: 'line', borderDash: [6, 5], pointRadius: 0 })] },
      options: opcoes({ xTipo: 'category', x: 'repetição', un: ' s' }) });
  }
}

// ===================== NAVEGAÇÃO =====================
async function rota() {
  [...graficos, ...graficosSinais].forEach(g => g.destroy()); graficos = []; graficosSinais = [];
  const [, tela, id] = location.hash.split('/');
  try {
    if (tela === 'login') return telaLogin();
    const { usuario } = await api('/api/me');
    if (!usuario) return (location.hash = '#/login');
    $('#sair').hidden = false;
    if (tela === 'paciente') return await telaPaciente(+id);
    if (tela === 'sessao') return await telaSessao(+id);
    await telaPacientes();
  } catch (erro) {
    app.innerHTML = `<p class="cartao erro">Não foi possível carregar: ${esc(erro.message)}</p>`;
  }
}
$('#sair').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.hash = '#/login'; };
if (window.Chart) Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
addEventListener('hashchange', rota);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rota);   // recolore os gráficos
rota();
</script>
